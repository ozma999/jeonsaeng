  --logo:"Black Han Sans","Galmuri11",sans-serif; --arc:"Press Start 2P","Galmuri11",monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--serif);font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word}
/* 별 배경 + CRT 주사선 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 10%,#ffe14d,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#19f7ff,transparent),radial-gradient(1px 1px at 85% 60%,#ff2bd6,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent),radial-gradient(1px 1px at 55% 45%,#fff,transparent),
  radial-gradient(ellipse at 50% -10%,rgba(255,43,214,.25),transparent 60%),radial-gradient(ellipse at 50% 110%,rgba(25,247,255,.18),transparent 60%);
  background-size:180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,100% 100%,100% 100%;animation:twinkle 3s steps(3) infinite}
@keyframes twinkle{50%{opacity:.55}}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 2px,transparent 2px 4px),
  linear-gradient(transparent 0,rgba(25,247,255,.05) 50%,transparent 100%),
  radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.7) 100%);
  background-size:100% 100%,100% 180px,100% 100%;animation:roll 5s linear infinite}
@keyframes roll{to{background-position:0 0,0 180px,0 0}}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;font-family:var(--arc);font-size:9px;color:var(--pink);letter-spacing:.05em}
.hud .rec{color:var(--neon)}
.hud #tc{color:#fff}
.hud button{font:12px var(--pixel);color:var(--cyan);background:none;border:2px solid var(--cyan);padding:3px 8px;cursor:pointer}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:24px 20px 56px;display:flex;flex-direction:column;justify-content:center}
h1{font-family:var(--logo);font-size:34px;line-height:1.25;font-weight:400;color:var(--neon);text-shadow:2px 2px 0 var(--pink),4px 4px 0 var(--cyan)}
h1 small{display:block;font-family:var(--pixel);font-size:13px;color:var(--cyan);margin-top:10px;text-shadow:none}
p{margin-bottom:12px}
.muted{color:var(--sub)}
.pixel{font-family:var(--pixel)}
.neon{color:var(--neon)}
/* 인트로 간판 */
.hiscore{display:flex;justify-content:space-between;font-family:var(--arc);font-size:8px;color:var(--pink);margin-bottom:18px}
.hiscore b{color:#fff;font-weight:400}
.marquee{position:relative;margin:8px 8px 6px;padding:22px 10px 18px;border-radius:14px;background:linear-gradient(#2a0a3d,#12041f);text-align:center;
  box-shadow:0 0 0 3px var(--pink),0 0 26px var(--pink),inset 0 0 30px rgba(255,43,214,.4)}
.marquee::before{content:"";position:absolute;inset:-10px;border-radius:20px;border:4px dotted var(--neon);animation:bulb .5s steps(2) infinite;filter:drop-shadow(0 0 4px var(--neon))}
@keyframes bulb{50%{border-color:var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))}}
.marquee .logo{font-family:var(--logo);font-size:60px;line-height:1;color:var(--neon);letter-spacing:.02em;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--cyan),0 0 24px rgba(255,225,77,.6);transform:skew(-6deg)}
.marquee .sub1{font-family:var(--arc);font-size:9px;color:var(--cyan);margin-top:14px;letter-spacing:.12em}
.marquee .tagline{font-family:var(--pixel);font-size:13px;color:#fff;margin-top:10px}
.insert{text-align:center;margin:22px 0 4px;font-family:var(--arc);font-size:12px;color:var(--neon);animation:blink 1s steps(2) infinite;text-shadow:0 0 8px var(--neon)}
/* 진자 → 무지개 최면 구슬 */
.pend{display:block;margin:10px auto 22px;width:180px;height:180px;overflow:visible;filter:drop-shadow(0 0 10px var(--pink))}
.pend g{transform-box:view-box;transform-origin:90px 10px;animation:swing 2.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.pend .orb{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 진행 바 */
.stagebar{display:flex;align-items:center;gap:10px;font-family:var(--arc);font-size:9px;margin-bottom:14px}
.stagebar .st{color:var(--neon)}
.stagebar .hp{flex:1;height:14px;border:2px solid #fff;padding:1px}
.stagebar .hp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 8px,#3bd11f 8px 10px);transition:width .4s steps(6)}
/* 대화창 */
.sub{position:relative;background:#0a0620;border:3px solid #fff;box-shadow:inset 0 0 0 3px #0a0620,inset 0 0 0 5px var(--pink),0 0 18px rgba(255,43,214,.35);padding:18px 18px 16px;min-height:5.2em;margin:0 0 20px;white-space:pre-line;font-size:17px;cursor:pointer}
.sub::before{content:"최면사";position:absolute;top:-12px;left:12px;font:12px var(--pixel);color:var(--bg);background:var(--pink);padding:1px 9px;white-space:nowrap}
.sub.plain::before{display:none}
.sub .prev{display:block;color:var(--sub)}
.sub .prev+#cur,.sub #cur{display:block;color:#fff}
.sub .caret{display:inline-block;width:.55em;background:var(--neon);animation:blink .8s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.qno{font-family:var(--arc);font-size:9px;color:var(--cyan);margin-bottom:14px;letter-spacing:.06em}
.opts{display:grid;gap:9px}
.opt{position:relative;font:inherit;font-size:16px;text-align:left;color:#fff;background:var(--surface);border:2px solid var(--line);padding:12px 14px 12px 34px;cursor:pointer;transition:background .1s,border-color .1s}
.opt::before{content:"▶";position:absolute;left:12px;color:var(--neon);opacity:0}
.opt:hover{background:var(--surface2);border-color:var(--cyan)}
.opt:hover::before{opacity:.6}
.opt.on{border-color:var(--neon);color:var(--neon);background:var(--surface2);box-shadow:0 0 14px rgba(255,225,77,.4)}
.opt.on::before{opacity:1;animation:blink .5s steps(2) infinite}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn{font-family:var(--pixel);font-size:15px;color:var(--bg);background:var(--cyan);border:0;padding:13px 20px;cursor:pointer;box-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--neon);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--pink),4px 4px 0 var(--neon)}
.btn.ghost{background:var(--bg);color:#fff;border:2px solid #fff;box-shadow:4px 4px 0 var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
label{display:block;font-family:var(--pixel);font-size:13px;color:var(--cyan);margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--neon);background:#0a0620;border:2px solid var(--line);padding:11px 13px;border-radius:0}
input:focus,select:focus{border-color:var(--cyan)}
.err{color:var(--pink);font-family:var(--pixel);font-size:13px;min-height:1.4em;margin-top:12px}
.back{font-family:var(--pixel);font-size:13px;color:var(--sub);background:none;border:0;cursor:pointer;margin-top:18px;align-self:flex-start;padding:4px 0}
.back:hover{color:var(--cyan)}
/* 화면 전환: 글리치 */
.vhs{animation:glitch .4s steps(4)}
@keyframes glitch{0%{filter:hue-rotate(90deg) contrast(1.6);transform:translateX(-6px) skewX(4deg)}33%{transform:translateX(5px)}66%{filter:hue-rotate(-60deg);transform:translateX(-2px)}100%{filter:none;transform:none}}
/* 결과 카드 */
.vs{text-align:center;font-family:var(--arc);font-size:10px;color:var(--cyan);letter-spacing:.15em;margin-bottom:6px}
.vs b{display:block;font-family:var(--logo);font-size:40px;font-weight:400;color:var(--neon);letter-spacing:0;margin-top:10px;text-shadow:3px 3px 0 var(--pink);animation:pop 1.2s ease-in-out infinite alternate}
@keyframes pop{to{transform:scale(1.06)}}
.sheet{position:relative;background:#0d0626;border:3px solid var(--neon);box-shadow:0 0 0 3px var(--pink),0 0 30px rgba(255,43,214,.6);padding:20px 18px 22px;margin-top:10px}
.sheet .tc{display:flex;justify-content:space-between;font-family:var(--arc);font-size:8px;color:var(--cyan);margin-bottom:16px}
.rank{position:absolute;right:-6px;top:-14px;font-family:var(--arc);font-size:20px;color:var(--pink);background:var(--neon);padding:10px 12px;transform:rotate(12deg);box-shadow:4px 4px 0 var(--cyan);z-index:2}
.who{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.portrait{flex:none;width:96px;height:120px;background:radial-gradient(circle at 50% 40%,var(--pink),#3a0c5c 65%,#0d0626);border:2px solid var(--cyan);overflow:hidden;display:flex;align-items:center;justify-content:center}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait svg{width:70%;height:70%}
.who .name{font-family:var(--logo);font-size:28px;line-height:1.25;color:#fff;text-shadow:2px 2px 0 var(--pink)}
.who .work{color:var(--cyan);font-size:14px;margin-top:4px}
.depth{font-family:var(--pixel);font-size:12px;color:var(--sub);margin-top:8px}
.depth b{color:var(--text);font-weight:400}
.sec{margin-top:20px;padding-top:16px;border-top:2px dashed var(--line)}
.sec h3{font-family:var(--arc);font-size:9px;font-weight:400;color:var(--pink);margin-bottom:10px;line-height:1.8;letter-spacing:.04em}
.sec h3 .muted{font-family:var(--pixel);font-size:11px}
.sec ol{padding-left:20px}
.sec li{margin-bottom:8px}
.sec li::marker{color:var(--neon)}
.portrait.big{width:170px;height:212px;margin:6px auto 16px;border:3px solid var(--neon);box-shadow:0 0 0 3px var(--pink),0 0 24px rgba(255,43,214,.6)}
.card-top{text-align:center}
.imgrow{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.portrait.sm{width:56px;height:70px}
.imgrow input{font-size:13px;padding:6px 8px}
.card-top .name,.reveal .name{font-family:var(--logo);font-size:34px;line-height:1.2;color:#fff;text-shadow:3px 3px 0 var(--pink),0 0 18px rgba(255,43,214,.6)}
.card-top .work{color:var(--cyan);font-size:14px;margin-top:4px}
.reveal{text-align:center}
.verdict{display:inline-block;font-size:16px;color:var(--bg);background:var(--neon);padding:3px 12px;margin:14px 0 6px}
.kw{font-family:var(--pixel);font-size:13px;color:var(--pink)}
.mbti{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mbti .opt{text-align:center;padding:11px 4px;font-family:var(--arc);font-size:10px}
.mbti .opt::before{display:none}
.comp{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin-bottom:12px;font-size:14px}
.comp b{font-family:var(--arc);font-size:10px;font-weight:400;color:var(--neon)}
.bar{grid-column:1/3;height:12px;background:#2a1450;border:2px solid #fff;padding:1px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--cyan) 0 6px,#0bb5bd 6px 8px)}
.bar i.on{background:repeating-linear-gradient(90deg,var(--neon) 0 6px,#ffb000 6px 8px)}
.sync{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-family:var(--arc);font-size:8px;color:#fff;margin-top:6px}
.sync .bar{grid-column:auto}
details.more summary{cursor:pointer;font-family:var(--pixel);font-size:14px;color:var(--neon);list-style:none}
details.more summary::before{content:'▶ '} details.more[open] summary::before{content:'▼ '}
details.more h3{margin-top:18px}
.quote{font-size:17px;line-height:1.75;color:#fff;background:#140a33;border-left:4px solid var(--neon);padding:10px 14px;margin:6px 0 18px}
.spoil{filter:blur(6px);cursor:pointer;transition:filter .2s}
.spoil.open{filter:none}
.note{font-family:var(--pixel);font-size:12px;color:var(--sub);margin-top:16px}
.ver{font-family:var(--arc);font-size:8px;color:var(--line);margin-top:28px;text-align:center}
.watermark{font-family:var(--pixel);font-size:10px;color:var(--sub);text-align:right;margin-top:14px}
.cont{text-align:center;margin-top:20px;font-family:var(--arc);font-size:9px;color:var(--neon);animation:blink 1s steps(2) infinite}
/* 관리자 / 발표 */
.wide main{max-width:1080px;justify-content:flex-start}
table{width:100%;border-collapse:collapse;font-size:14px;font-family:var(--pixel)}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--cyan);font-weight:400}
td select{font-size:13px;padding:4px 6px}
.slide{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.slide .big{font-family:var(--logo);font-size:60px;line-height:1.15;font-weight:400;text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--cyan)}
.slide .big.neon{color:var(--neon)}
.slide .hint{font-size:24px;margin:10px 0}
.slide .who .portrait{border:3px solid var(--neon);box-shadow:0 0 0 3px var(--pink),0 0 30px var(--pink)}
.counter{font-family:var(--arc);color:var(--pink);font-size:11px}
.bonds{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.bond{background:#0d0626;border:2px solid var(--cyan);box-shadow:4px 4px 0 var(--pink);padding:14px}

/* ── 레어도 · 뽑기 공개 ── */
:root{--ssr:#ffe14d;--sr:#ff2bd6;--r:#19f7ff;--n:#cfc8ea}
.flipwrap{position:relative;width:230px;height:330px;margin:10px auto 6px;perspective:1100px;cursor:pointer}
.flipwrap .fi{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.4,.5,1)}
.flipwrap.open .fi{transform:rotateY(180deg)}
.flipwrap.charge .fi{animation:charge 1.6s ease-in forwards}
@keyframes charge{0%{transform:rotateY(0)}15%{transform:rotateY(-12deg) translateX(-3px)}30%{transform:rotateY(12deg) translateX(3px)}45%{transform:rotateY(-18deg) translateX(-5px)}60%{transform:rotateY(18deg) translateX(5px)}80%{transform:rotateY(-6deg) scale(1.04)}100%{transform:rotateY(0) scale(1.06)}}
.flipwrap .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--gc,#fff);background:#0d0626;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3px #05030d,0 0 26px var(--gc,#fff)}
.flipwrap .back{background:repeating-linear-gradient(45deg,#2a1450 0 12px,#140a33 12px 24px)}
.flipwrap .back b{font-family:var(--arc);font-size:56px;color:var(--neon);text-shadow:4px 4px 0 var(--pink);animation:pop .5s ease-in-out infinite alternate}
.flipwrap .back i{font-style:normal;font-family:var(--arc);font-size:9px;color:var(--cyan);margin-top:18px;letter-spacing:.15em}
.flipwrap .front{transform:rotateY(180deg);padding:12px;justify-content:flex-start}
.flipwrap .front .portrait{width:100%;height:220px;border:0;box-shadow:none;margin:0}
.flipwrap .front .nm{font-family:var(--logo);font-size:24px;line-height:1.2;color:#fff;text-shadow:2px 2px 0 var(--pink);margin-top:10px;text-align:center}
.flipwrap .front .wk{font-size:12px;color:var(--cyan)}
.gbadge{position:absolute;top:-14px;right:-16px;z-index:3;font-family:var(--arc);font-size:15px;color:#05030d;background:var(--gc,#fff);padding:8px 9px;transform:rotate(10deg);box-shadow:3px 3px 0 #05030d}
.charge-glow{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,var(--gc,#fff) 0,transparent 65%);opacity:0;pointer-events:none}
.flipwrap.charge .charge-glow{animation:glowup 1.6s ease-in forwards}
@keyframes glowup{to{opacity:.55;transform:scale(1.15)}}
.g-SSR{--gc:var(--ssr)} .g-SR{--gc:var(--sr)} .g-R{--gc:var(--r)} .g-N{--gc:var(--n)} .g-HIDDEN{--gc:#7cff4f}
.g-SSR.open .front,.g-HIDDEN.open .front{animation:rainbow 1.2s linear infinite}
@keyframes rainbow{0%{border-color:#ffe14d}25%{border-color:#ff2bd6}50%{border-color:#19f7ff}75%{border-color:#7cff4f}100%{border-color:#ffe14d}}
.g-SSR.open::after{content:"";position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;z-index:-1;background:repeating-conic-gradient(rgba(255,225,77,.28) 0 8deg,transparent 8deg 16deg);animation:spin 10s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 65%);mask:radial-gradient(circle,#000 25%,transparent 65%)}
.rate{font-family:var(--pixel);font-size:13px;color:var(--sub);margin-top:6px}
.rate b{color:var(--gc,#fff);font-weight:400}
.after{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none}
.after.on{opacity:1;transform:none;pointer-events:auto}
.gtitle{font-family:var(--arc);font-size:12px;color:var(--gc,#fff);text-shadow:0 0 10px var(--gc,#fff);letter-spacing:.1em;margin-top:8px;min-height:1.6em}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx .flash{position:absolute;inset:0;background:#fff;animation:flash .6s ease-out forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
#fx i{position:absolute;top:-20px;width:9px;height:9px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.rank.g-SSR,.rank.g-SR,.rank.g-R,.rank.g-N,.rank.g-HIDDEN{background:var(--gc);color:#05030d}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:70;font-family:var(--arc);font-size:12px;color:#05030d;background:#7cff4f;padding:14px 18px;box-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--cyan);animation:pop .4s ease-in-out 4 alternate}
.secret-btn{display:block;margin:18px auto 0;font:14px var(--pixel);color:#7cff4f;background:#05030d;border:2px dashed #7cff4f;padding:10px 16px;cursor:pointer;animation:blink 1.2s steps(2) infinite}
/* ═══ v2.0 화려함 추가 ═══ */
/* 배경 무대: 네온 바닥 격자 + 줄무늬 태양 + 떠다니는 픽셀 외계인 */
#stage-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#stage-bg .sun{position:absolute;left:50%;bottom:12vh;width:42vh;height:42vh;margin-left:-21vh;border-radius:50%;
  background:linear-gradient(#ffe14d,#ff7a3d 45%,#ff2bd6 80%);opacity:.2;filter:blur(.3px);
  -webkit-mask:linear-gradient(#000 0 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 76%,transparent 76% 82%,#000 82% 88%,transparent 88%);
  mask:linear-gradient(#000 0 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 76%,transparent 76% 82%,#000 82% 88%,transparent 88%)}
#stage-bg .floor{position:absolute;left:-50%;right:-50%;bottom:-2vh;height:26vh;transform:perspective(26vh) rotateX(58deg);transform-origin:bottom;opacity:.55;
  background-image:linear-gradient(#ff2bd6 2px,transparent 2px),linear-gradient(90deg,#19f7ff 2px,transparent 2px);background-size:48px 48px;animation:floor 1s linear infinite;
  -webkit-mask:linear-gradient(transparent,#000 40%);mask:linear-gradient(transparent,#000 40%)}
@keyframes floor{to{background-position:0 48px,0 0}}
#stage-bg .inv{position:absolute;width:4px;height:4px;color:#7cff4f;opacity:.55;animation:drift linear infinite;
  box-shadow:8px 0,24px 0,12px 4px,20px 4px,8px 8px,12px 8px,16px 8px,20px 8px,24px 8px,4px 12px,8px 12px,16px 12px,24px 12px,28px 12px,0 16px,4px 16px,8px 16px,12px 16px,16px 16px,20px 16px,24px 16px,28px 16px,32px 16px,0 20px,8px 20px,24px 20px,32px 20px,12px 24px,20px 24px}
#stage-bg .inv.a{left:6%;top:18%;animation-duration:19s}
#stage-bg .inv.b{left:80%;top:32%;color:#ff2bd6;animation-duration:24s;animation-delay:-8s}
#stage-bg .inv.c{left:45%;top:8%;color:#19f7ff;animation-duration:28s;animation-delay:-14s}
@keyframes drift{0%{transform:translate(0,0)}25%{transform:translate(40px,30px)}50%{transform:translate(-20px,60px)}75%{transform:translate(-50px,20px)}100%{transform:translate(0,0)}}
/* 화면 테두리 전구 (둘레를 따라 흐름) */
.bulbs{position:fixed;z-index:40;pointer-events:none;background-repeat:repeat;animation:chase .45s steps(2) infinite}
.bulbs.t,.bulbs.b{left:0;right:0;height:10px;background-image:radial-gradient(circle,#ffe14d 0 2.5px,transparent 3.5px),radial-gradient(circle,#ff2bd6 0 2.5px,transparent 3.5px);background-size:28px 10px;background-position:0 0,14px 0}
.bulbs.t{top:0}.bulbs.b{bottom:0}
.bulbs.l,.bulbs.r{top:0;bottom:0;width:10px;background-image:radial-gradient(circle,#19f7ff 0 2.5px,transparent 3.5px),radial-gradient(circle,#ffe14d 0 2.5px,transparent 3.5px);background-size:10px 28px;background-position:0 0,0 14px}
.bulbs.l{left:0}.bulbs.r{right:0}
@keyframes chase{50%{background-position:14px 0,0 0}}
.bulbs.l,.bulbs.r{animation-name:chasev}
@keyframes chasev{50%{background-position:0 14px,0 0}}
/* HUD: 이퀄라이저 + 지금 재생 */
.hud .mus{display:flex;align-items:center;gap:8px}
#eq{display:inline-flex;align-items:flex-end;gap:2px;height:18px}
#eq i{display:block;width:4px;height:3px;background:linear-gradient(#ff2bd6,#ffe14d)}
#np{font-family:var(--pixel);font-size:11px;color:var(--neon);white-space:nowrap}
.hud>span:first-child{white-space:nowrap}
@media (max-width:420px){.hud{font-size:8px;padding:16px 16px 0}#np{font-size:10px}.hud .tlabel{display:none}}
/* 박자 쿵 */
.beat .marquee .logo{transform:skew(-6deg) scale(1.05)}
.beat .marquee{box-shadow:0 0 0 3px var(--cyan),0 0 40px var(--cyan),inset 0 0 40px rgba(25,247,255,.4)}
.beat .pend{filter:drop-shadow(0 0 22px #ffe14d)}
.beat .sub{box-shadow:inset 0 0 0 3px #0a0620,inset 0 0 0 5px var(--cyan),0 0 28px rgba(25,247,255,.55)}
.beat #stage-bg .sun{opacity:.3}
.marquee .logo,.marquee,.pend,.sub{transition:transform .1s,box-shadow .1s,filter .1s}
/* 로고 글리치 */
.marquee .logo{animation:logoglitch 4s steps(1) infinite}
@keyframes logoglitch{0%,88%,100%{text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--cyan),0 0 24px rgba(255,225,77,.6)}
  90%{text-shadow:-6px 0 0 var(--pink),6px 2px 0 var(--cyan),0 0 24px rgba(255,225,77,.6);clip-path:inset(10% 0 40% 0)}
  92%{text-shadow:8px -2px 0 var(--pink),-4px 3px 0 var(--cyan);clip-path:inset(50% 0 5% 0)}
  94%{text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--cyan);clip-path:none}}
/* 대화창 테두리 색 순환 */
.sub{animation:boxcycle 3s linear infinite}
@keyframes boxcycle{0%,100%{border-color:#fff}33%{border-color:var(--neon)}66%{border-color:var(--cyan)}}
/* STAGE 스플래시 */
.splash{position:fixed;left:0;right:0;top:38%;z-index:55;pointer-events:none;text-align:center;animation:splash 1.15s ease-out forwards}
.splash b{display:inline-block;font-family:var(--arc);font-size:34px;color:var(--neon);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--cyan);padding:14px 26px;background:linear-gradient(90deg,transparent,rgba(5,3,13,.92) 20%,rgba(5,3,13,.92) 80%,transparent)}
.splash small{display:block;font-family:var(--arc);font-size:11px;color:#fff;margin-top:10px;letter-spacing:.3em}
@keyframes splash{0%{transform:translateX(100vw) skewX(-20deg)}22%{transform:translateX(-12px) skewX(6deg)}30%{transform:none}78%{transform:none;opacity:1}100%{transform:translateX(-100vw) skewX(-20deg);opacity:0}}
/* 선택지: 빛줄기 + 불꽃 */
.opt{overflow:hidden}
.opt::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);transition:left .45s}
.opt:hover::after{left:120%}
.spark{position:fixed;z-index:58;width:6px;height:6px;pointer-events:none;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.bonus{position:fixed;z-index:58;pointer-events:none;font-family:var(--arc);font-size:11px;color:#7cff4f;text-shadow:2px 2px 0 #05030d;animation:bonus 1s ease-out forwards}
@keyframes bonus{to{transform:translateY(-50px);opacity:0}}
/* 결과 카드: 무지개 테두리 + 초상 홀로그램 */
.sheet{animation:sheetcycle 2.4s linear infinite}
@keyframes sheetcycle{0%,100%{border-color:var(--neon);box-shadow:0 0 0 3px var(--pink),0 0 30px rgba(255,43,214,.6)}50%{border-color:var(--cyan);box-shadow:0 0 0 3px var(--neon),0 0 36px rgba(25,247,255,.6)}}
.portrait{position:relative}
.portrait.big::after,.flipwrap .front .portrait::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%);animation:holo 2.8s ease-in-out infinite;pointer-events:none}
@keyframes holo{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.shake{animation:shake .45s steps(6)}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){h1{font-size:28px}.marquee .logo{font-size:50px}.who .name{font-size:24px}.slide .big{font-size:40px}.card-top .name,.reveal .name{font-size:28px}}

/* v2.1 전생 회상록 */
.lore .tape{display:flex;justify-content:space-between;align-items:center;font-family:var(--arc);font-size:8px;color:var(--cyan);background:#07031a;border:1px solid var(--line);padding:8px 10px;margin-bottom:14px;letter-spacing:.06em}
.lore .tape .rec{color:#ff4d6d;animation:recb 1.2s steps(2) infinite}
@keyframes recb{50%{opacity:.25}}
.lore .lp{font-size:15.5px;line-height:1.95;color:#efe9ff;margin:0 0 14px;text-align:left;word-break:keep-all;opacity:0;transform:translateY(8px);animation:lpin .7s ease forwards}
.lore .lp:nth-of-type(2){animation-delay:.25s}.lore .lp:nth-of-type(3){animation-delay:.5s}
@keyframes lpin{to{opacity:1;transform:none}}
.scenes{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.scene{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#1a0b3d,#0d0626);border:1px solid var(--line);border-left:6px double var(--pink);padding:9px 12px;text-align:left;font-size:14px;color:#fff}
.scene b{flex:none;font-family:var(--arc);font-size:8px;color:var(--neon);letter-spacing:.05em}
details.seal{margin-top:14px;border:2px solid var(--pink);background:repeating-linear-gradient(45deg,#170833 0 10px,#1d0b40 10px 20px);padding:10px 12px;text-align:left}
details.seal summary{cursor:pointer;list-style:none;font-family:var(--pixel);font-size:14px;color:var(--pink)}
details.seal summary::before{content:'▣ '} details.seal[open] summary::before{content:'□ '}
details.seal p{margin:10px 0 0;font-size:15px;line-height:1.9;color:#ffd9f4;word-break:keep-all}
.bonds{display:grid;grid-template-columns:1fr;gap:10px}
.bond{display:flex;gap:12px;align-items:center;text-align:left;background:#120836;border:1px solid var(--line);padding:10px;position:relative}
.bond .portrait.sm{border-color:var(--pink)}
.bond .bn{font-size:16px;color:#fff;font-weight:700}
.bond .br{display:inline-block;margin-left:6px;font-size:11px;padding:1px 7px;background:var(--neon);color:#120836;font-weight:700;vertical-align:2px}
.bond .bl{font-size:13.5px;line-height:1.6;color:#cfc6f5;margin-top:4px;word-break:keep-all}
.voice{position:relative;background:#07031a;border:3px solid #fff;box-shadow:0 0 0 3px var(--cyan);padding:16px 16px 14px;margin:18px 0 6px;text-align:left}
.voice::before{content:attr(data-who);position:absolute;top:-12px;left:12px;background:var(--cyan);color:#07031a;font-size:12px;font-weight:700;padding:1px 8px}
.voice p{font-size:17px;line-height:1.7;color:#fff;margin:0;word-break:keep-all}
.voice p::after{content:'▼';margin-left:6px;color:var(--neon);font-size:11px;animation:recb 1s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.lore .lp{opacity:1;transform:none;animation:none}}

/* v2.1.1 가독성 */
.sec h3{font-size:9px;color:var(--pink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec h3 em{font-style:normal;font-family:var(--logo);font-size:19px;color:#fff;letter-spacing:0;text-shadow:2px 2px 0 var(--pink)}
.clues{list-style:none;padding:0!important;margin:0;display:flex;flex-direction:column;gap:10px}
.clues li{display:flex;flex-direction:column;gap:4px;text-align:left;background:#120836;border:1px solid var(--line);border-left:4px solid var(--neon);padding:10px 12px;margin:0!important;font-size:15px;line-height:1.75;color:#efe9ff}
.clues li b{font-family:var(--arc);font-size:8px;color:var(--neon);font-weight:400}
.memo{margin:12px 0 0;text-align:left;font-size:14px;color:#cfc6f5}
.memo b{color:var(--cyan);margin-right:6px}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
.tile{text-align:left;background:#0b0524;border:2px solid var(--cyan);padding:10px 12px}
.tile b{display:block;color:var(--cyan);font-size:13px;margin-bottom:2px}
.tile span{font-size:15px;line-height:1.7;color:#fff}
.sheet .sec p:not(.verdict):not(.kw):not(.rate){color:#efe9ff}
/* 이미지 저장용 */
.cap *,.cap{animation:none!important;transition:none!important}
.cap .lp{opacity:1!important;transform:none!important}
.cap details,.cap .voice p::after{display:none!important}

/* v2.2 전생 단편 */
.tale{text-align:left}
.tale-head{text-align:center;padding:6px 0 18px;border-bottom:2px dashed var(--line);margin-bottom:18px}
.wbadge{display:inline-block;font-size:12px;font-weight:700;color:#07031a;background:var(--cyan);padding:1px 10px}
.tale-cap{margin:12px 0 2px;font-size:14px;color:#cfc6f5}
.tale-name{font-family:var(--logo);font-size:44px;line-height:1.2;color:#fff;text-shadow:3px 3px 0 var(--pink),0 0 18px rgba(255,43,214,.6)}
.tale-title{margin:8px 0 0;font-size:16px;color:var(--neon)}
.tale-body p{font-size:16.5px;line-height:2;color:#f3eeff;margin:0 0 18px;word-break:keep-all}
.tale-body p:last-child{color:#fff;background:linear-gradient(180deg,rgba(255,43,214,.10),rgba(25,247,255,.06));border:1px solid var(--line);border-left:4px solid var(--pink);padding:12px 14px}
.tale-epi{margin-top:8px;background:#07031a;border:2px solid var(--neon);padding:14px 16px}
.tale-epi b{display:block;font-size:12px;color:var(--neon);margin-bottom:6px}
.tale-epi p{font-size:15.5px;line-height:1.9;color:#fff;margin:0 0 10px;word-break:keep-all}
.tale-epi .tale-close{margin:0;color:var(--cyan);font-size:14px}
.look .lk-card{position:relative;text-align:center;padding:4px 0 4px}
.look .lk-card .rank{top:0;right:0}
.look .lk-lead{margin:14px 0 6px;text-align:left;opacity:1;animation:none}
.lk-more h4{margin:18px 0 10px;font-size:15px;color:var(--pink);text-align:left}
.lk-more .lp{opacity:1;animation:none}
.lk-btn{display:block;width:100%;margin-top:12px}
.cap .lk-btn{display:none!important}
.cap .bar i{background:var(--cyan)!important}.cap .bar i.on{background:var(--neon)!important}
@media (prefers-reduced-motion:reduce){.tale-name{text-shadow:3px 3px 0 var(--pink)}}

/* v3 전생 생애 */
.pl{text-align:left}
.pl-card{text-align:center;border-bottom:2px dashed var(--line);padding-bottom:16px;margin-bottom:6px}
.pl-dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:16px 0 0;text-align:left;font-size:15px}
.pl-dl dt{color:var(--cyan);font-size:13px;padding-top:2px;white-space:nowrap}
.pl-dl dd{margin:0;color:#fff;line-height:1.6}
.pl-dl dd span{display:block;color:#cfc6f5;font-size:13px}
.pl-dl dd.gap{color:var(--neon);font-family:var(--logo);font-size:22px}
.pl-h{font-family:var(--arc);font-size:9px;font-weight:400;color:var(--pink);margin:24px 0 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pl-h em{font-style:normal;font-family:var(--logo);font-size:19px;color:#fff;text-shadow:2px 2px 0 var(--pink)}
.pl-tl{list-style:none;padding:0;margin:0;border-left:3px solid var(--line);margin-left:6px}
.pl-tl li{position:relative;padding:0 0 18px 18px}
.pl-tl li::before{content:'';position:absolute;left:-9px;top:6px;width:13px;height:13px;background:#0d0626;border:3px solid var(--cyan)}
.pl-tl li.real::before{border-color:var(--neon);background:var(--neon)}
.pl-when{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.pl-when b{font-family:var(--arc);font-size:10px;color:var(--neon);font-weight:400}
.pl-when span{font-size:13px;color:var(--cyan)}
.pl-when i{font-style:normal;font-size:11px;font-weight:700;color:#07031a;background:var(--neon);padding:0 6px}
.pl-tl p{margin:0;font-size:16px;line-height:1.95;color:#f3eeff;word-break:keep-all}
.pl-tl li.real p{background:linear-gradient(180deg,rgba(255,225,77,.08),rgba(25,247,255,.05));border:1px solid var(--line);border-left:4px solid var(--neon);padding:10px 12px}
.pl-tr{padding-left:18px;margin:0}
.pl-tr li{font-size:15px;line-height:1.85;color:#efe9ff;margin-bottom:8px}
.pl-tr li b{color:var(--neon)}
details.pl-src{margin-top:20px;border:1px solid var(--line);padding:10px 12px;text-align:left}
details.pl-src summary{cursor:pointer;font-size:14px;color:var(--cyan)}
details.pl-src li{font-size:13.5px;line-height:1.7;color:#cfc6f5;margin:6px 0}
details.pl-src a{color:var(--neon)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;color:#efe9ff;background:#0a0620;border:2px solid var(--line);padding:6px 12px;cursor:pointer}
.chip.on{color:#07031a;background:var(--neon);border-color:var(--neon)}

/* v3.1 */
.lg{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--arc);font-size:16px;color:#07031a;background:var(--neon);padding:6px 12px;margin-bottom:10px}
.lg small{font-family:var(--pixel);font-size:11px;margin-top:2px}
.lg.g-SSR{background:linear-gradient(90deg,#ff2bd6,#ffe14d,#19f7ff)}.lg.g-SR{background:var(--pink);color:#fff}.lg.g-R{background:var(--cyan)}.lg.g-N{background:#cfc6f5}
.lifeno{margin:12px 0 0;font-size:13px;color:#cfc6f5}.lifeno b{color:var(--neon)}
.pl-when u{text-decoration:none;font-size:11px;color:#cfc6f5;border:1px solid var(--line);padding:0 6px}
.hn{margin-top:22px;border:2px solid var(--line);background:#07031a;padding:12px 14px;text-align:left}
.hn b{display:block;color:var(--cyan);font-size:13px;margin-bottom:4px}.hn p{margin:0 0 6px;font-size:14px;line-height:1.75;color:#efe9ff}
.hn-f i{font-style:normal;font-size:11px;font-weight:700;color:#07031a;background:var(--neon);padding:0 6px;margin-right:4px}.hn-f a{color:var(--neon)}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.dx{position:relative;text-align:left;font:inherit;color:#fff;background:#120836;border:2px solid var(--line);padding:12px 10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.dx b{font-family:var(--logo);font-size:20px;font-weight:400}.dx em{font-style:normal;font-size:12px;color:var(--cyan)}.dx small{font-size:12px;color:#cfc6f5}
.dx .dg{font-family:var(--arc);font-size:9px;color:#07031a;background:#cfc6f5;padding:2px 6px;align-self:flex-start}
.dx.g-SSR .dg{background:linear-gradient(90deg,#ff2bd6,#ffe14d,#19f7ff)}.dx.g-SR .dg{background:var(--pink);color:#fff}.dx.g-R .dg{background:var(--cyan)}
.dx.g-SSR{border-color:var(--neon)}.dx.rep{box-shadow:0 0 0 2px var(--pink)}
.dx i{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;color:var(--pink)}

.echo{text-align:left;font-size:15.5px;line-height:1.9;color:#fff;background:linear-gradient(90deg,rgba(255,43,214,.12),rgba(25,247,255,.06));border-left:4px solid var(--pink);padding:10px 14px;margin:0 0 14px;word-break:keep-all}
.pxs{display:block;width:100%;border:3px solid #07031a;box-shadow:0 0 0 2px var(--neon);margin:0 0 6px}
.pxcap{font-family:var(--pixel);font-size:11px;color:#9a92c4;margin:0 0 14px;text-align:center}
.sharecard .pxs{margin:0 0 4px}
.tmini .tm{display:flex;gap:12px;align-items:flex-start;text-align:left}.tm-pic{flex:none;width:52px;height:64px;overflow:hidden;border:2px solid var(--pink);background:#3a0c5c}.tm-pic img{width:100%;height:100%;object-fit:cover}.tm-n{font-size:15px;color:#fff;font-weight:700}.tm-n span{font-weight:400;color:#9a92c4;font-size:13px}.tm-t p{margin:4px 0 0;font-size:13px;line-height:1.7;color:#cfc6f5;word-break:keep-all}
.sc-tw{display:flex;gap:10px;align-items:center;text-align:left;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}.sc-tw .tm-pic{width:40px;height:50px}.sc-tw b{display:block;font-size:11px;color:var(--pink);font-weight:400}.sc-tw span{font-size:13px;color:#fff}
.mu{list-style:none;padding:0;margin:0 0 10px;text-align:left}.mu li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.7;word-break:keep-all}.mu-t{display:inline-block;font-size:11px;color:#07031a;background:var(--cyan);padding:0 6px;margin-right:6px}.mu-x{text-align:left;font-size:14px;line-height:1.7;margin-top:10px;word-break:keep-all}.mu-x b{color:var(--pink)}
.eramap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:20px}.era{border:1px solid var(--line);padding:12px 14px;text-align:left;background:rgba(13,6,38,.85)}
.sharecard{position:fixed;left:-2000px;top:0;width:360px;background:#0d0626;border:3px solid var(--neon);box-shadow:0 0 0 3px var(--pink);padding:18px 18px 16px;text-align:center;color:#fff}
.sc-top{display:flex;justify-content:space-between;font-family:var(--arc);font-size:8px;color:var(--cyan);margin-bottom:14px}
.sc-g{display:inline-block;font-size:13px;font-weight:700;color:#07031a;background:var(--cyan);padding:2px 10px}.sc-g.g-SSR{background:var(--neon)}.sc-g.g-SR{background:var(--pink);color:#fff}.sc-g.g-N{background:#cfc6f5}
.sc-meta{margin:6px 0 14px;font-size:14px;color:#cfc6f5}
.sc-real,.sc-end{text-align:left;border:1px solid var(--line);padding:10px 12px;margin-bottom:10px}
.sc-real{border-left:4px solid var(--neon)}.sc-real i{font-style:normal;font-size:11px;font-weight:700;color:#07031a;background:var(--neon);padding:0 6px}
.sc-real b,.sc-end b{display:block;margin:6px 0 4px;font-size:13px;color:var(--cyan)}.sc-real p,.sc-end p{margin:0;font-size:14px;line-height:1.8;word-break:keep-all}
.sc-twin{font-size:13px;color:var(--pink);margin:8px 0 2px}.sc-foot{font-size:11px;color:#9a92c4;margin:0}
</style>
</head>
<body>
<div id="stage-bg" aria-hidden="true"><div class="sun"></div><div class="floor"></div><i class="inv a"></i><i class="inv b"></i><i class="inv c"></i></div>
<div class="bulbs t"></div><div class="bulbs b"></div><div class="bulbs l"></div><div class="bulbs r"></div>
<div id="app">
  <div class="hud"><span><span class="rec">CREDIT 01</span><span class="tlabel"> · TIME</span> <span id="tc">00:00:00</span></span><span class="mus"><span id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span id="np"></span><button id="snd" aria-pressed="true" title="소리 끄기">♪ ON</button></span></div>
  <main id="view" aria-live="polite"></main>
</div>
<script>
const API='/api/game';
const $=s=>document.querySelector(s);
const view=$('#view');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 타임코드
const t0=Date.now(); setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#tc').textContent=[s/3600|0,(s/60|0)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');},1000);

// 소리: 기본 켜짐. 브라우저 정책상 첫 클릭·키 입력 순간에 시작된다.
/* ── 칩튠 음악 엔진: 화면마다 다른 BGM (타이틀 · 최면 · 스테이지 · 결과) ── */
let actx=null, master=null, soundOn=true, musicBus=null, echoIn=null, analyser=null, NOISE=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(actx) return; actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=soundOn?1:0;
  const comp=actx.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=8; comp.ratio.value=4;
  analyser=actx.createAnalyser(); analyser.fftSize=64; analyser.smoothingTimeConstant=.7;
  master.connect(comp); comp.connect(analyser); analyser.connect(actx.destination);
  musicBus=actx.createGain(); musicBus.gain.value=.62; musicBus.connect(master);
  const dl=actx.createDelay(1); dl.delayTime.value=.28; const fb=actx.createGain(); fb.gain.value=.3; const wet=actx.createGain(); wet.gain.value=.25;
  echoIn=actx.createGain(); echoIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(musicBus);
  NOISE=actx.createBuffer(1,actx.sampleRate,actx.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  setInterval(schedule,25); eqLoop();
}
// ── 악기 ──
function env(g,t,a,peak,dec,sus,end){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.setTargetAtTime(peak*sus,t+a,dec); g.gain.setTargetAtTime(0.0001,end,.03); }
function voice(type,f,t,dur,peak,{echo=0,lp=0,detune=0}={}){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f; if(detune) o.detune.value=detune;
  let node=o; if(lp){ const fl=actx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp; o.connect(fl); node=fl; }
  node.connect(g); g.connect(musicBus); if(echo){ const s=actx.createGain(); s.gain.value=echo; g.connect(s); s.connect(echoIn); }
  env(g,t,.006,peak,.08,.55,t+dur); o.start(t); o.stop(t+dur+.2);
}
function lead(m,t,dur){ voice('square',mtof(m),t,dur,.075,{echo:.5,lp:3600}); voice('square',mtof(m),t,dur,.045,{lp:3000,detune:9}); }
function arp(m,t,dur){ voice('square',mtof(m),t,dur*.6,.03,{echo:.35,lp:2400}); }
function bass(m,t,dur){ voice('triangle',mtof(m),t,dur*.9,.32); voice('square',mtof(m),t,dur*.5,.03,{lp:700}); }
function pad(ms,t,dur){ ms.forEach(m=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(.045,t+dur*.4); g.gain.linearRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(musicBus);
  const s=actx.createGain(); s.gain.value=.4; g.connect(s); s.connect(echoIn); o.start(t); o.stop(t+dur+.05); }); }
function noise(t,dur,peak,hp){ const s=actx.createBufferSource(); s.buffer=NOISE; const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=actx.createGain();
  g.gain.setValueAtTime(peak,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); s.connect(f); f.connect(g); g.connect(musicBus); s.start(t); s.stop(t+dur+.02); }
function kick(t,v=1){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(42,t+.13);
  g.gain.setValueAtTime(.85*v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+.18); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+.2); pulseAt(t); }
function snare(t){ noise(t,.14,.32,1400); voice('triangle',190,t,.06,.12); }
function hat(t){ noise(t,.035,.1,7000); }

let mCur=null, mPend=null, mStep=0, mNext=0;
function setTrack(name){ if(name===undefined) return; const t=name?TRACKS[name]:null; if(mCur===t&&!mPend) return;
  if(!mCur){ mCur=t; mStep=0; mNext=actx?actx.currentTime+.05:0; } else mPend=name?t:'stop';
  const np=$('#np'); if(np) np.textContent=t?'♪ '+t.label:''; }
function schedule(){
  if(!actx||!mCur) return;
  if(mNext<actx.currentTime-.2) mNext=actx.currentTime+.05;
  while(mNext<actx.currentTime+.12){
    const T=mCur, sp=60/T.bpm/4, s16=mStep%16, bar=Math.floor(mStep/16)%T.chords.length;
    if(s16===0 && mPend){ mCur=mPend==='stop'?null:mPend; mPend=null; mStep=0; if(!mCur) return; continue; }
    const [root,q]=T.chords[bar], tones=[0,q==='m'?3:4,7,12].map(x=>root+x), t=mNext;
    if(soundOn){
      const dch=T.drums[s16]; if(dch==='x'||dch==='k') kick(t,T.soft?.45:1); if(dch==='s'||dch==='o') snare(t); if(dch==='x'||dch==='o'||dch==='h') hat(t);
      if(s16%2===0){ const b=T.bassPat[s16/2]; if(typeof b==='number'){ let n=1; while(T.bassPat[s16/2+n]==='-') n++; bass(root-24+b,t,sp*2*n); } }
      if(T.arp) arp(tones[(T.soft?Math.floor(s16/2):s16)%4]+12,t,sp*(T.soft?2:1));
      if(T.pad && s16===0) pad(tones.slice(0,3),t,sp*16);
      if(T.lead && s16%2===0){ const ln=T.lead[bar%T.lead.length], v=ln[s16/2]; if(typeof v==='number'&&v>0){ let n=1; while(ln[s16/2+n]==='-') n++; lead(v,t,sp*2*n*.92); } }
    }
    mNext+=sp; mStep++;
  }
}

function pulseAt(t){ if(reduce) return; setTimeout(()=>{ document.body.classList.add('beat'); setTimeout(()=>document.body.classList.remove('beat'),110); },Math.max(0,(t-actx.currentTime)*1000)); }
function eqLoop(){ const bars=[...document.querySelectorAll('#eq i')], buf=new Uint8Array(analyser.frequencyBinCount);
  (function f(){ analyser.getByteFrequencyData(buf); bars.forEach((b,i)=>{ const v=buf[2+i*3]||0; b.style.height=(3+v/255*15)+'px'; }); requestAnimationFrame(f); })(); }
function typeBlip(){ if(!actx||!soundOn) return; const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(); o.type='square'; o.frequency.value=1250+Math.random()*120;
  g.gain.setValueAtTime(.035,t); g.gain.exponentialRampToValueAtTime(.0001,t+.025); o.connect(g); g.connect(master); o.start(t); o.stop(t+.03); }
function tick(){}
function blip(f=880,d=.07,type='square'){ if(!actx||!soundOn) return; const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.5,t+d); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.01); }
function tune(notes,step=.11,type='square'){ if(!actx||!soundOn) return; const t0=actx.currentTime;
  notes.forEach((f,i)=>{ if(!f) return; const t=t0+i*step,o=actx.createOscillator(),g=actx.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.0001,t+step*1.8); o.connect(g); g.connect(master); o.start(t); o.stop(t+step*2); }); }

async function api(data,method='POST'){
  const opt=method==='GET'?{}:{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)};
  const url=method==='GET'?API+'?'+new URLSearchParams(data):API;
  const r=await fetch(url,opt); const j=await r.json().catch(()=>({error:'응답을 읽을 수 없습니다.'}));
  if(!r.ok) throw new Error(j.error||'요청에 실패했습니다.'); return j;
}

function type(el,text,done){
  if(reduce){el.textContent=text;done&&done();return;}
  let i=0,stop=false; el.innerHTML=''; const caret=document.createElement('span'); caret.className='caret'; caret.innerHTML='&nbsp;';
  const node=document.createTextNode(''); el.append(node,caret);
  el.onclick=()=>{stop=true;node.data=text;caret.remove();el.onclick=null;done&&done();};
  (function step(){ if(stop) return; if(i>=text.length){caret.remove();el.onclick=null;done&&done();return;}

}

  q8:{t:'당신에게는 아무에게도 말하지 않은\n비밀이 있습니다.',o:['나는 한 번 죽었다가 돌아왔다','사실 엄청난 힘이나 신분을 숨기고 있다','한 사람을 오래 좋아하고 있다','비밀 같은 건 없다. 그게 비밀이다']},
  q9:{t:'시간이 흘러, 당신 곁에 누군가 서 있습니다.\n누구인가요?',o:['평생 나를 이기려 했던 라이벌','함께 목숨을 걸었던 동료들','단 한 사람','고양이 한 마리']},

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

// 이미지는 브라우저가 원본 주소에서 바로 받는다(나무위키는 서버 쪽 요청을 막는다). 실패하면 프록시 → 실루엣 순으로 대체
const imgSrc=u=>u||'';
const proxied=u=>'/api/img?u='+encodeURIComponent(u);
window.imgFail=function(el,mode){
  const orig=el.dataset.o||el.getAttribute('src')||'';
  if(!el.dataset.p && /^https?:/.test(orig)){ el.dataset.p=1; el.dataset.o=orig; el.src=proxied(orig); return; }
  if(mode==='remove') el.remove(); else el.replaceWith(document.createRange().createContextualFragment(SIL));
};
let SERVER_VERSION=null;
const ADMIN_NAME='김현우';
const normName=n=>String(n||'').replace(/\s+/g,'');

  const saved=JSON.parse(localStorage.getItem('js_gate')||'{}');
  show(`<div class="hiscore"><span>1UP <b>${esc(saved.nick||'PLAYER')}</b></span><span>HI-SCORE <b>999990</b></span></div>

  <p class="note" style="margin-top:6px">영혼이 쉬어 간 시간을 계산하는 데만 씁니다. 날짜는 묻지 않습니다.</p>
  <div class="row" style="justify-content:center"><button class="btn" id="go">▶ 영혼 1개 투입하기</button></div><div class="err" id="err">${esc(msg)}</div>
  <p class="ver">${VERSION} · ${BUILD}${SERVER_VERSION&&SERVER_VERSION!==VERSION?` · 서버 ${esc(SERVER_VERSION)} (서버 파일이 아직 이전 버전입니다)`:''}</p>`);
  $('#nick').onkeydown=e=>{ if(e.key==='Enter') $('#go').click(); };
  { let taps=0,tt; const lg=$('.marquee'); if(lg) lg.onclick=()=>{ taps++; clearTimeout(tt); tt=setTimeout(()=>taps=0,1500); blip(440+taps*80,.05); if(taps>=7){ taps=0; unlock('konami'); } }; }
  $('#go').onclick=async()=>{

    const year=+$('#by').value||0;

  <p class="muted" style="margin-top:12px">다시 최면을 걸면 기존 기록은 새 기록으로 바뀝니다. 다른 기기에서도 같은 이름이면 이 기록이 열립니다.</p>

  show(`<p class="qno">최면 전 대화</p><div class="sub" id="s"></div><label for="by2">태어난 해</label><select id="by2"><option value="">고르세요</option>${(()=>{const a=[];for(let y=2010;y>=1950;y--)a.push(`<option>${y}</option>`);return a.join('');})()}</select><div class="err" id="err"></div><div class="row"><button class="btn" id="n">시작</button></div>`);

function pretalk(){ setTrack('deep');

const SLOTS=['새벽','아침','낮','저녁','밤'], SIBS=['외동','맏이','둘째','셋째','넷째','막내'];
const LANDS=['바다','강','산','눈','사막','도시의 골목'], FEARS=['물','불','높은 곳','좁은 곳','큰 소리','딱히 없음'];
const MARKS=['얼굴','목','어깨','팔','손','가슴','등','다리','발','없음'];
const chips=(id,list,cur)=>`<div class="chips" id="${id}">${list.map((t,i)=>`<button class="chip${cur===i?' on':''}" data-i="${i}">${t}</button>`).join('')}</div>`;
function bindChips(id,key){ $('#'+id).onclick=e=>{const b=e.target.closest('.chip'); if(!b) return; const i=+b.dataset.i; S[key]=S[key]===i?null:i; [...$('#'+id).children].forEach((c,k)=>c.classList.toggle('on',k===S[key]));}; }
function birthInfo(){
  const years=[]; for(let y=2010;y>=1950;y--) years.push(y);
  show(`<p class="qno">최면 전 대화 · 출생 기록</p><div class="sub" id="s"></div>
  <label for="by">태어난 해 (필수)</label><select id="by"><option value="">고르세요</option>${years.map(y=>`<option${+S.year===y?' selected':''}>${y}</option>`).join('')}</select>
  <p class="note" style="margin-top:6px">전생의 시대를 거슬러 계산하는 데만 씁니다. 날짜는 묻지 않습니다.</p>
  <label>태어난 시간대 (알면)</label>${chips('sl',SLOTS,S.slot)}
  <label>형제 중에서는</label>${chips('sb',SIBS,S.sib)}

  bindChips('sl','slot'); bindChips('sb','sib');
  $('#n').onclick=()=>{ const v=$('#by').value; if(!v){ $('#err').textContent='태어난 해를 골라 주세요.'; return; } S.year=+v; breathe(); };
}
function breathe(){ setTrack('deep');
  show(`${PEND}<div class="sub plain" id="s" style="text-align:center"></div><div class="row" style="justify-content:center"><button class="btn ghost" id="skip">건너뛰기</button></div>`);
  let done=false; const next=()=>{ if(done) return; done=true; S.step=0; step(); };
  $('#skip').onclick=()=>{S.skipped=true;next();};
  const lines=['진자를 따라 천천히 숨을 들이쉬세요…','…그리고 내쉬세요.','한 번 더… 들이쉬고…','…내쉬세요.'];
  let k=0; (function line(){ if(done) return; if(k>=lines.length){ setTimeout(next,600); return;} type($('#s'),lines[k++],()=>setTimeout(line,900)); })();
}
function step(){
  const cur=FLOW[S.step];
  if(cur.startsWith('narr:')) return narr(cur.slice(5));
  if(cur==='bonus') return bonus();
  if(cur==='wake') return wake();
  question(cur);
}
function narr(k){ setTrack('deep');
  show(`<div class="sub" id="s"></div><div class="row"><button class="btn" id="n" disabled>계속</button></div>`);
  type($('#s'),NARR[k],()=>{$('#n').disabled=false;$('#n').focus();});
  $('#n').onclick=()=>{S.step++;step();};
}
function question(q){ setTrack('stage');
  const idx=['q1','q2','q3','q4','q5','q6','q7','q8','q9','q10'].indexOf(q)+1;
  if(!reduce && S.lastSplash!==q){ S.lastSplash=q; const sp=document.createElement('div'); sp.className='splash'; sp.innerHTML=`<b>STAGE ${String(idx).padStart(2,'0')}</b><small>${idx===10?'FINAL STAGE':'READY?'}</small>`; document.body.appendChild(sp); setTimeout(()=>sp.remove(),1200); tune([523,659,784],.07); }
  show(`<div class="stagebar"><span class="st">STAGE ${String(idx).padStart(2,'0')}</span><span class="hp"><i style="width:${idx*10}%"></i></span><span>${String(idx).padStart(2,'0')}/10</span></div><div class="sub" id="s"></div><div class="opts" id="o"></div>${S.step>1?'<button class="back" id="bk">← 이전 장면</button>':''}`);
  let shownAt=0;
  type($('#s'),QS[q].t,()=>{
    shownAt=performance.now();
    $('#o').innerHTML=ORDERS[q].map(i=>`<button class="opt${S.answers[q]===i?' on':''}" data-i="${i}">${esc(QS[q].o[i])}</button>`).join('');
    $('#o').onclick=e=>{const b=e.target.closest('.opt'); if(!b) return; const i=+b.dataset.i;
      if(S.answers[q]!==undefined && S.answers[q]!==i) S.changes++;
      S.answers[q]=i; S.timings[q]=Math.round(performance.now()-shownAt);
      sparks(b); if(S.timings[q]<2500) floatText(b,'SPEED BONUS!');
      b.classList.add('on'); setTimeout(()=>{S.step++;step();},reduce?0:260);};
  });
  const bk=$('#bk'); if(bk) bk.onclick=()=>{ do{S.step--;}while(S.step>0&&FLOW[S.step].startsWith('narr:')); step(); };
}
function bonus(){ setTrack('stage');
  show(`<p class="qno">깨어나기 전에 (모두 선택)</p><div class="sub" id="s"></div>
  <label>물웅덩이에 비친 얼굴은?</label><div class="opts" id="lk">${LOOKS.map((t,i)=>`<button class="opt${S.look===i?' on':''}" data-i="${i}">${t}</button>`).join('')}</div>
  <label for="fr">지금 떠오르는 장면을 한 줄로 (비워도 됩니다)</label><input id="fr" maxlength="60" value="${esc(S.free)}">
  <label>까닭 없이 끌리는 풍경</label>${chips('ld',LANDS,S.land)}
  <label>이유 없이 무서운 것</label>${chips('fe',FEARS,S.fear)}
  <label>몸에 점이나 흉터가 있는 곳</label>${chips('mk',MARKS,S.mark)}
  <label for="jb">현생에서 하는 일</label><select id="jb"><option value="">고르지 않음</option>${JOBS.map(j=>`<option${S.job===j?' selected':''}>${j}</option>`).join('')}</select>
  <div class="row"><button class="btn" id="n">깨어나기</button></div><button class="back" id="bk">← 이전 장면</button>`);
  type($('#s'),'물웅덩이에 당신의 얼굴이 비칩니다.');
  $('#lk').onclick=e=>{const b=e.target.closest('.opt'); if(!b) return; const i=+b.dataset.i; S.look=S.look===i?null:i;
    [...$('#lk').children].forEach((c,k)=>c.classList.toggle('on',k===S.look));};
  bindChips('ld','land'); bindChips('fe','fear'); bindChips('mk','mark');
  $('#n').onclick=()=>{S.free=$('#fr').value.trim(); S.job=$('#jb').value||null; S.step++; step();};
  $('#bk').onclick=()=>{S.step--;step();};
}
function wake(){ setTrack('deep');
  show(`${PEND}<div class="sub plain" id="s" style="text-align:center"></div><div class="err" id="err"></div>`);
  const send=api({action:'submit',nick:S.nick,mbti:S.mbti,answers:S.answers,timings:S.timings,changes:S.changes,skipped:S.skipped,look:S.look,belief:S.belief,free:S.free,job:S.job,year:S.year,slot:S.slot,sib:S.sib,land:S.land,fear:S.fear,mark:S.mark});
  type($('#s'),'이제 깨어납니다.\n하나…\n둘…\n셋.\n눈을 뜨세요.',async()=>{
    try{ const r=await send; result(r.result,r.revealed,true); }
    catch(e){ $('#err').innerHTML=esc(e.message)+' <button class="btn ghost" id="re">다시 시도</button>'; $('#re').onclick=wake; }
  });
}

// 기억이 세 번에 걸쳐 떠오른 뒤, 직접 맞힌다
function recall(r,revealed){ setTrack('deep');
  let k=0;

    const canRead=src=>new Promise(res=>{const t=new Image();t.crossOrigin='anonymous';t.onload=()=>res(true);t.onerror=()=>res(false);t.src=src;});
    const swaps=[];
    for(const im of [...$('#sheet').querySelectorAll('img')]){
      if(await canRead(im.src)) continue;
      const o=im.dataset.o||im.getAttribute('src')||''; const alt=/^https?:/.test(o)?proxied(o):null;
      if(alt && await canRead(alt)){ swaps.push([im,'src',im.src]); im.src=alt; await new Promise(r=>im.complete?r():im.onload=r); }
      else { const ph=document.createRange().createContextualFragment(SIL).firstElementChild; im.style.display='none'; im.after(ph); swaps.push([im,'ph',ph]); }
    }
    $('#sheet').classList.add('cap'); await new Promise(r=>setTimeout(r,60));
    const cv=await html2canvas($('#sheet'),{backgroundColor:'#0d0626',scale:2,useCORS:true}).finally(()=>$('#sheet').classList.remove('cap'));
    swaps.forEach(([im,k,v])=>{ if(k==='src') im.src=v; else { v.remove(); im.style.display=''; } }); const a=document.createElement('a'); a.download=`전생_${r.nick}.png`; a.href=cv.toDataURL('image/png'); a.click(); };
  if(LF){ if(fresh && typeof fx==='function' && ['SSR','SR'].includes(LF.profile.grade)) setTimeout(()=>fx(LF.profile.grade),300);
    $('#card').onclick=async()=>{ if(!window.html2canvas) return alert('이미지 도구를 불러오는 중입니다. 잠시 후 다시 눌러 주세요.');
      const real=LF.timeline.find(t=>t.real), end=LF.timeline.find(t=>t.tag==='마지막');
      const box=document.createElement('div'); box.className='sharecard cap'; box.innerHTML=`<div class="sc-top"><span>PAST LIFE RECORD</span><span>1UP · ${esc(r.nick)}</span></div>
        ${pxImg?`<img class="pxs" src="${pxImg}" alt="">`:''}<span class="sc-g g-${LF.profile.grade}">${LF.profile.grade} · 이 시대가 나올 확률 약 ${LF.profile.rate}%</span>
        <p class="tale-cap">그 시절 당신의 이름은</p><div class="tale-name">${esc(LF.profile.name)}</div><p class="tale-title">${esc(LF.profile.era)}</p>
        <p class="sc-meta">${LF.profile.by}년 ~ ${LF.profile.dy}년 · ${esc(LF.profile.job)}</p>
        <div class="sc-real"><i>기록 대조 · 일치</i><b>${real.when}년 ${esc(real.tag)}</b><p>${esc(real.text)}</p></div>
        <div class="sc-end"><b>${end.when}년 · 마지막</b><p>${esc(end.core||end.text)}</p></div>
        <div class="sc-tw"><div class="tm-pic">${portrait(c)}</div><div><b>같은 영혼의 또 다른 생</b><span>${esc(c.name)} · ${esc(c.work)}</span></div></div><p class="sc-foot">사내 동호회 모임용 · 외부 공유 금지</p>`;
      document.body.appendChild(box); await new Promise(r=>setTimeout(r,80));
      try{ const cv=await html2canvas(box,{backgroundColor:'#0d0626',scale:2,useCORS:true}); const a=document.createElement('a'); a.download=`전생카드_${r.nick}.png`; a.href=cv.toDataURL('image/png'); a.click(); } finally { box.remove(); } };
    const busy=b=>{b.disabled=true;b.textContent='최면 중…';};
    const rp=$('#rep'); if(rp) rp.onclick=async()=>{ busy(rp); const d=await api({action:'setRep',nick:r.nick,i:r.lifeIdx}); result(d.result,d.revealed); };
    $('#rr').onclick=async()=>{ busy($('#rr')); try{ const d=await api({action:'reroll',nick:r.nick}); result(d.result,d.revealed,true); scrollTo(0,0); }catch(e){ alert(e.message); } };
    $('#dx').onclick=()=>dexView(r,revealed); }
  { const lb=$('#lkb'); if(lb) lb.onclick=()=>{ const m=$('#lkm'); m.hidden=!m.hidden; lb.textContent=m.hidden?'원작 속 그 사람 더 보기 ▼':'접기 ▲'; }; }
  view.querySelectorAll('.secret-btn').forEach(b=>b.onclick=()=>{ hiddenCard(b.dataset.h); setTimeout(()=>{ const bk=$('#bk'); if(bk) bk.onclick=()=>result(r,revealed); },0); });
  // 히든 조합: 이름이 헷갈리는 존재 + 아무도 부르지 않는 이름 + "……배고프다."
  if(fresh && S.answers && S.answers.q2===3 && S.answers.q6===3 && S.answers.q10===3 && unlock('hypnotist')) setTimeout(()=>result(r,revealed),2300);
  { const sy=view.querySelector('.sync'); if(sy&&!reduce){ const bi=sy.querySelector('i'), lab=sy.lastElementChild, tgt=r.depth||0; let v=0; bi.style.width='0%';
    const iv=setInterval(()=>{ v=Math.min(tgt,v+3); bi.style.width=v+'%'; lab.textContent=v+'%'; if(v%9===0) blip(400+v*8,.03); if(v>=tgt) clearInterval(iv); },28); } }
  $('#cp').onclick=async()=>{ const t=`🕹️ 전생체험 결과\n${r.nick}의 전생은… ${r.life?`*${r.life.profile.name}* [${r.life.profile.grade}] — ${r.life.profile.era}의 ${r.life.profile.job} (${r.life.profile.by}~${r.life.profile.dy})\n함께한 역사: ${r.life.profile.anchor.year}년 ${r.life.profile.anchor.title}\n같은 영혼의 또 다른 생: `:''}${!r.life&&r.past?`*${r.past.profile.name}* — ${r.past.profile.born.slice(0,5)} ${r.past.profile.place_then}의 ${r.past.profile.job} (${r.past.profile.anchor.year}년 ${r.past.profile.anchor.title})\n영혼이 쉬어 간 시간: ${r.past.profile.gap.y}년\n그 시절 닮은 사람: `:''}${!r.life&&!r.past&&r.tale?`「${r.tale.title}」의 *${r.tale.name}* (${r.tale.world})\n그 시절 닮은 사람: `:''}*${c.name}* (${c.work})${c.rarity?` [${c.rarity.grade} · 등장 확률 ${c.rarity.rate<0.01?'0.01% 미만':c.rarity.rate+'%'}]`:''}\n${r.verdict||''}\n영혼 구성: ${(r.composition||[]).map(x=>x.name+' '+x.pct+'%').join(' · ')}`;
    try{ await navigator.clipboard.writeText(t); $('#cp').textContent='복사했습니다'; }catch{ prompt('아래 문구를 복사하세요',t); } };
  $('#redo').onclick=()=>{ for(const k in ORDERS) ORDERS[k]=shuffle(ORDERS[k]); S={...S,answers:{},timings:{},changes:0,skipped:false,look:null,free:'',job:null,mbti:null,step:0}; startHypno(); };
}

/* ───────── 관리자 ───────── */
async function admin(code){ setTrack(null);
  if(!code){ show(`<h1 style="font-size:26px">관리자</h1><label for="ac">관리자 이름</label><input id="ac"><div class="row"><button class="btn" id="go">들어가기</button></div><div class="err" id="err"></div>`);
    $('#go').onclick=()=>admin($('#ac').value.trim()); return; }
  let d; try{ d=await api({action:'admin',adminCode:code,op:'list'}); }catch(e){ return admin(), setTimeout(()=>$('#err').textContent=e.message); }
  sessionStorage.setItem('js_admin',code);
  show(`<h1 style="font-size:26px">관리자 <small>응답 ${d.subs.length}명 · 캐릭터 DB ${d.chars}명 ${d.demo?'· 메모리 저장(데모)':''}</small></h1>
  <div class="row"><button class="btn" id="ra">전역 재배정 실행</button><button class="btn ghost" id="rv">${d.revealed?'인연 공개 끄기':'인연 공개 켜기'}</button><a class="btn ghost" href="?present" style="text-decoration:none">발표 모드</a></div>
  <p class="note">재배정: 각자의 후보 10명 안에서 중복 없이 다시 배정하고, 같은 작품 인연이 생기도록 가산합니다. 수동 지정한 사람은 유지됩니다.</p>
  <div style="overflow-x:auto;margin-top:16px"><table><tr><th>이름</th><th>현재 전생</th><th>후보에서 지정</th><th></th></tr>
  ${d.subs.sort((a,b)=>a.nick.localeCompare(b.nick)).map(s=>{const cur=s.top.find(t=>t.id===s.assigned)||{};
    return `<tr><td>${esc(s.nick)}${s.locked?' <span class="neon">수동</span>':''}</td><td>${esc(cur.name||s.assigned)}<br><span class="muted">${esc(cur.work||'')}</span></td>
    <td><select data-n="${esc(s.nick)}" class="ov">${s.top.map(t=>`<option value="${t.id}"${t.id===s.assigned?' selected':''}>${esc(t.name)} · ${esc(t.work)} (${t.score})</option>`).join('')}</select></td>
    <td><button class="btn ghost rs" data-n="${esc(s.nick)}" style="padding:4px 8px;font-size:12px">초기화</button></td></tr>`}).join('')}
  </table></div>
  <h2 style="font-size:20px;margin-top:36px">전체 전생 도감 <small class="muted" id="dexcnt" style="font-size:12px"></small></h2>
  <div id="adex" style="overflow-x:auto;margin-top:8px"></div>
  <h2 style="font-size:20px;margin-top:36px">캐릭터 이미지 <small class="muted pixel" style="font-size:12px" id="imgcnt"></small></h2>
  <p class="note">비어 있는 캐릭터부터 보여 줍니다. 나무위키·네이버웹툰 이미지 주소를 붙여 넣고 저장하면 바로 뜹니다(재배포 불필요). 비우고 저장하면 원래대로.</p>
  <div id="imgs" style="margin-top:12px"></div>`,true);
  api({action:'admin',adminCode:code,op:'dex'}).then(({dex})=>{ $('#dexcnt').textContent=`${dex.length}명 · 전생 ${dex.reduce((a,x)=>a+x.lives.length,0)}개`;
    $('#adex').innerHTML=`<table><tr><th>이름</th><th>전생 수</th><th>대표 전생</th><th>도감</th></tr>${dex.sort((a,b)=>a.nick.localeCompare(b.nick)).map(x=>{const R=x.lives[x.rep]||{};
      return `<tr><td>${esc(x.nick)}</td><td>${x.lives.length}</td><td>${esc(R.name||'')} <span class="muted">· ${esc(R.era||'')} · ${R.grade||''}</span></td><td class="muted" style="font-size:12px">${x.lives.map((c,i)=>c?`${i+1}. ${esc(c.name)}(${c.grade}, ${esc(c.era)}, ${c.by}~${c.dy})`:'').join('<br>')}</td></tr>`}).join('')}</table>`; });
  api({action:'admin',adminCode:code,op:'chars'}).then(({chars})=>{
    const box=$('#imgs'); $('#imgcnt').textContent=`${chars.filter(c=>c.image).length} / ${chars.length}명 이미지 있음`;
    chars.sort((a,b)=>(!!a.image)-(!!b.image));
    box.innerHTML=chars.map(c=>`<div class="imgrow"><div class="portrait sm">${c.image?`<img src="${esc(imgSrc(c.image))}" alt="" referrerpolicy="no-referrer" onerror="imgFail(this,'remove')">`:''}</div>
      <div><b>${esc(c.name)}</b> <span class="muted">· ${esc(c.work)}${c.override?' · 붙여 넣은 주소':''}</span>
      <div style="display:flex;gap:8px;margin-top:6px"><input data-id="${c.id}" placeholder="이미지 주소 붙여 넣기" value="${c.override?esc(c.image):''}"><button class="btn ghost sv" data-id="${c.id}" style="padding:6px 12px">저장</button></div></div></div>`).join('');
    // 이미지 점검: 이 브라우저에서 실제로 뜨는지 8초 뒤 집계
    setTimeout(()=>{ const rows=[...box.querySelectorAll('.imgrow')]; const bad=[]; let ok=0, ext=0;
      rows.forEach((row,i)=>{ const c=chars[i]; if(!c.image) return; if(!c.image.startsWith('/')) ext++; const im=row.querySelector('img'); if(im&&im.complete&&im.naturalWidth>0) ok++; else bad.push(c.name); });
      $('#imgcnt').textContent=`${chars.filter(c=>c.image).length} / ${chars.length}명 이미지 있음 · 이 브라우저에서 정상 ${ok} · 깨짐 ${bad.length} · 바깥 주소 ${ext}`;
      if(bad.length) $('#imgs').insertAdjacentHTML('beforebegin',`<p class="err">깨진 이미지 ${bad.length}명: ${bad.slice(0,40).map(esc).join(', ')}${bad.length>40?' …':''}<br>→ scripts/download_images.py 로 이미지를 저장소에 내려받으면 해결됩니다 (README 참고).</p>`);
    },8000);
    box.querySelectorAll('.sv').forEach(b=>b.onclick=async()=>{ const v=box.querySelector(`input[data-id="${b.dataset.id}"]`).value;
      try{ await api({action:'admin',adminCode:code,op:'setImage',id:b.dataset.id,url:v}); b.textContent='저장됨'; const pf=b.closest('.imgrow').querySelector('.portrait'); pf.innerHTML=v?`<img src="${esc(imgSrc(v))}" alt="" referrerpolicy="no-referrer" onerror="imgFail(this,'remove')">`:''; }catch(e){ alert(e.message); } });
  });
  $('#ra').onclick=async()=>{ $('#ra').disabled=true; await api({action:'admin',adminCode:code,op:'reassign'}); admin(code); };
  $('#rv').onclick=async()=>{ await api({action:'admin',adminCode:code,op:'reveal',value:!d.revealed}); admin(code); };
  view.querySelectorAll('.ov').forEach(s=>s.onchange=async()=>{ await api({action:'admin',adminCode:code,op:'override',nick:s.dataset.n,id:s.value}); admin(code); });
  view.querySelectorAll('.rs').forEach(b=>b.onclick=async()=>{ if(!confirm(b.dataset.n+'님의 기록을 지울까요?')) return; await api({action:'admin',adminCode:code,op:'reset',nick:b.dataset.n}); admin(code); });
}

/* ───────── 발표 모드 ───────── */
async function present(){ setTrack('title');
  const adminCode=sessionStorage.getItem('js_admin')||'';
  let d; try{ d=await api({action:'present',adminCode},'GET'); }
  catch(e){ return show(`<h1 style="font-size:26px">발표 모드</h1><p class="muted" style="margin-top:12px">${esc(e.message)} 첫 화면에서 관리자 이름으로 들어오거나, 인연 공개를 켠 뒤 다시 열어 주세요.</p><div class="row"><a class="btn" href="?admin" style="text-decoration:none">관리자로 이동</a></div>`); }
  const list=shuffle(d.results.filter(r=>r.life)); let i=0, stage=0; const MAP=d.map||{eras:[],relay:[]};
  const pxOf=r=>{ const P=r.life.profile; return window.pixelScene?pixelScene(P.pack,{slot:['새벽','아침','낮','저녁','밤'][P.slot],seed:P.name+P.by,g:P.g,ni:P.ni,job:P.job}):''; };
  function render(){
    if(i>=list.length) return bondsView();
    const r=list[i], P=r.life.profile, end=r.life.timeline.find(t=>t.tag==='마지막'), M=r.meet||{bonds:[]};
    const hints=`<p class="hint">· ${esc(P.era)}</p><p class="hint">· ${esc(P.job)}${P.job.match(/[가-힣]$/)&&((P.job.slice(-1).charCodeAt(0)-0xAC00)%28)&&((P.job.slice(-1).charCodeAt(0)-0xAC00)%28)!==8?'으로':'로'} 살았습니다</p><p class="hint">· ${P.anchor.year}년 ${esc(P.anchor.title)}의 시대</p>`;
    show(`<div class="slide"><p class="counter">${i+1} / ${list.length} · ${['누구의 전생일까요?','전생 공개','현생 공개'][stage]}</p>
      ${stage===0?`<div style="margin-top:16px">${hints}</div>`:''}
      ${stage>=1?`<div style="margin-top:16px"><img src="${pxOf(r)}" alt="" style="width:100%;max-width:640px;display:block;margin:0 auto 12px;border:3px solid #07031a;box-shadow:0 0 0 2px var(--neon)"><span class="verdict g-${P.grade}" style="background:var(--gc);font-family:var(--arc);font-size:14px">${P.grade}</span><div class="big neon">${esc(P.name)}</div><div class="work" style="font-size:20px">${P.by}~${P.dy} · ${esc(P.job)} · ${esc(P.place)}</div>${end?`<p class="hint">${esc(end.core||end.text)}</p>`:''}</div>`:''}
      ${stage>=2?`<p class="big" style="font-size:40px;margin-top:20px">${esc(r.nick)}</p>${M.bonds.length?`<p class="hint">전생 인연: ${M.bonds.map(b=>esc(b.nick)+'('+esc(b.type)+')').join(', ')}</p>`:''}${M.soulmate?`<p class="hint">소울메이트: ${esc(M.soulmate.nick)}${M.rival?` · 라이벌: ${esc(M.rival.nick)}`:''}</p>`:''}`:''}
      <div class="row"><button class="btn ghost" id="pv">이전</button><button class="btn" id="nx">다음</button><button class="btn ghost" id="bv">인연 지도</button></div></div>`,true);
    $('#nx').onclick=next; $('#pv').onclick=prev; $('#bv').onclick=bondsView;
  }
  function next(){ if(stage<2) stage++; else {i++;stage=0;} render(); }
  function prev(){ if(stage>0) stage--; else if(i>0){i--;stage=2;} render(); }
  function bondsView(){
    show(`<h1 style="font-size:28px">전생 인연 지도 <small>같은 시대를 살았던 영혼들</small></h1>
      <div class="eramap">${MAP.eras.map(g=>`<div class="era"><p class="neon pixel" style="font-size:13px">${esc(g.era)}</p><p class="muted" style="margin:0 0 6px">${g.anchor.year}년 ${esc(g.anchor.title)}</p>${g.people.map(x=>`<p style="margin:4px 0">${esc(x.nick)} — ${esc(x.name)} · ${esc(x.job)} <span class="muted">(${esc(x.place)})</span></p>`).join('')}</div>`).join('')||'<p class="muted">아직 같은 시대에서 만난 영혼이 없습니다.</p>'}</div>
      ${MAP.relay.length?`<h2 style="font-size:20px;margin-top:24px">영혼의 바통 <small>한 생이 끝날 무렵 다른 생이 시작된 사이</small></h2>${MAP.relay.map(x=>`<p style="margin:4px 0">${esc(x.from)}(${esc(x.fromName)}, ${x.dy}년 떠남) → ${esc(x.to)}(${esc(x.toName)}, ${x.by}년 태어남)</p>`).join('')}`:''}
      <div class="row"><button class="btn ghost" id="bk2">발표로 돌아가기</button></div>`,true);
    $('#bk2').onclick=()=>{ if(i>=list.length) i=list.length-1; render(); };
  }
  document.onkeydown=e=>{ if(!$('#nx')) return; if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();} if(e.key==='ArrowLeft') prev(); };
  render();
}

/* ───────── 시작 ───────── */
const qs=new URLSearchParams(location.search);
const boot=()=>{ if(qs.has('admin')) admin(sessionStorage.getItem('js_admin')); else if(qs.has('present')) present(); else gate(); };
fetch(API+'?action=config').then(r=>r.json()).then(c=>{ if(c.jobs) JOBS=c.jobs; SERVER_VERSION=c.version||'v1.2 이하'; if(c.error) throw new Error(c.error); boot(); }).catch(e=>{ boot(); if(e.message&&$('#err')) $('#err').textContent=e.message; });
</script>
