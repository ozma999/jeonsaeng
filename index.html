<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전생체험 — 당신은 전생에 어떤 웹툰 캐릭터였나</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{
  --bg:#05030d; --surface:#140a33; --surface2:#2a1450; --line:#4b3a8a;
  --text:#ffffff; --sub:#a99ad6; --neon:#ffe14d; --pink:#ff2bd6; --cyan:#19f7ff; --green:#7cff4f;
  --serif:"Galmuri11","Galmuri9",monospace; --pixel:"Galmuri11","Galmuri9",monospace;
  --logo:"Black Han Sans","Galmuri11",sans-serif; --arc:"Press Start 2P","Galmuri11",monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--serif);font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word}
/* 별 배경 + CRT 주사선 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 10%,#ffe14d,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#19f7ff,transparent),radial-gradient(1px 1px at 85% 60%,#ff2bd6,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent),radial-gradient(1px 1px at 55% 45%,#fff,transparent),
  radial-gradient(ellipse at 50% -10%,rgba(255,43,214,.25),transparent 60%),radial-gradient(ellipse at 50% 110%,rgba(25,247,255,.18),transparent 60%);
  background-size:180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,100% 100%,100% 100%;animation:twinkle 3s steps(3) infinite}
@keyframes twinkle{50%{opacity:.55}}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 2px,transparent 2px 4px),
  linear-gradient(transparent 0,rgba(25,247,255,.05) 50%,transparent 100%),
  radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.7) 100%);
  background-size:100% 100%,100% 180px,100% 100%;animation:roll 5s linear infinite}
@keyframes roll{to{background-position:0 0,0 180px,0 0}}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;font-family:var(--arc);font-size:9px;color:var(--pink);letter-spacing:.05em}
.hud .rec{color:var(--neon)}
.hud #tc{color:#fff}
.hud button{font:12px var(--pixel);color:var(--cyan);background:none;border:2px solid var(--cyan);padding:3px 8px;cursor:pointer}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:24px 20px 56px;display:flex;flex-direction:column;justify-content:center}
h1{font-family:var(--logo);font-size:34px;line-height:1.25;font-weight:400;color:var(--neon);text-shadow:2px 2px 0 var(--pink),4px 4px 0 var(--cyan)}
h1 small{display:block;font-family:var(--pixel);font-size:13px;color:var(--cyan);margin-top:10px;text-shadow:none}
p{margin-bottom:12px}
.muted{color:var(--sub)}
.pixel{font-family:var(--pixel)}
.neon{color:var(--neon)}
/* 인트로 간판 */
.hiscore{display:flex;justify-content:space-between;font-family:var(--arc);font-size:8px;color:var(--pink);margin-bottom:18px}
.hiscore b{color:#fff;font-weight:400}
.marquee{position:relative;margin:8px 8px 6px;padding:22px 10px 18px;border-radius:14px;background:linear-gradient(#2a0a3d,#12041f);text-align:center;
  box-shadow:0 0 0 3px var(--pink),0 0 26px var(--pink),inset 0 0 30px rgba(255,43,214,.4)}
.marquee::before{content:"";position:absolute;inset:-10px;border-radius:20px;border:4px dotted var(--neon);animation:bulb .5s steps(2) infinite;filter:drop-shadow(0 0 4px var(--neon))}
@keyframes bulb{50%{border-color:var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))}}
.marquee .logo{font-family:var(--logo);font-size:60px;line-height:1;color:var(--neon);letter-spacing:.02em;text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--cyan),0 0 24px rgba(255,225,77,.6);transform:skew(-6deg)}
.marquee .sub1{font-family:var(--arc);font-size:9px;color:var(--cyan);margin-top:14px;letter-spacing:.12em}
.marquee .tagline{font-family:var(--pixel);font-size:13px;color:#fff;margin-top:10px}
.insert{text-align:center;margin:22px 0 4px;font-family:var(--arc);font-size:12px;color:var(--neon);animation:blink 1s steps(2) infinite;text-shadow:0 0 8px var(--neon)}
/* 진자 → 무지개 최면 구슬 */
.pend{display:block;margin:10px auto 22px;width:180px;height:180px;overflow:visible;filter:drop-shadow(0 0 10px var(--pink))}
.pend g{transform-box:view-box;transform-origin:90px 10px;animation:swing 2.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.pend .orb{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 진행 바 */
.stagebar{display:flex;align-items:center;gap:10px;font-family:var(--arc);font-size:9px;margin-bottom:14px}
.stagebar .st{color:var(--neon)}
.stagebar .hp{flex:1;height:14px;border:2px solid #fff;padding:1px}
.stagebar .hp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 8px,#3bd11f 8px 10px);transition:width .4s steps(6)}
/* 대화창 */
.sub{position:relative;background:#0a0620;border:3px solid #fff;box-shadow:inset 0 0 0 3px #0a0620,inset 0 0 0 5px var(--pink),0 0 18px rgba(255,43,214,.35);padding:18px 18px 16px;min-height:5.2em;margin:0 0 20px;white-space:pre-line;font-size:17px;cursor:pointer}
.sub::before{content:"최면사";position:absolute;top:-12px;left:12px;font:12px var(--pixel);color:var(--bg);background:var(--pink);padding:1px 9px;white-space:nowrap}
.sub.plain::before{display:none}
.sub .prev{display:block;color:var(--sub)}
.sub .prev+#cur,.sub #cur{display:block;color:#fff}
.sub .caret{display:inline-block;width:.55em;background:var(--neon);animation:blink .8s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.qno{font-family:var(--arc);font-size:9px;color:var(--cyan);margin-bottom:14px;letter-spacing:.06em}
.opts{display:grid;gap:9px}
.opt{position:relative;font:inherit;font-size:16px;text-align:left;color:#fff;background:var(--surface);border:2px solid var(--line);padding:12px 14px 12px 34px;cursor:pointer;transition:background .1s,border-color .1s}
.opt::before{content:"▶";position:absolute;left:12px;color:var(--neon);opacity:0}
.opt:hover{background:var(--surface2);border-color:var(--cyan)}
.opt:hover::before{opacity:.6}
.opt.on{border-color:var(--neon);color:var(--neon);background:var(--surface2);box-shadow:0 0 14px rgba(255,225,77,.4)}
.opt.on::before{opacity:1;animation:blink .5s steps(2) infinite}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn{font-family:var(--pixel);font-size:15px;color:var(--bg);background:var(--cyan);border:0;padding:13px 20px;cursor:pointer;box-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--neon);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--pink),4px 4px 0 var(--neon)}
.btn.ghost{background:var(--bg);color:#fff;border:2px solid #fff;box-shadow:4px 4px 0 var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
label{display:block;font-family:var(--pixel);font-size:13px;color:var(--cyan);margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--neon);background:#0a0620;border:2px solid var(--line);padding:11px 13px;border-radius:0}
input:focus,select:focus{border-color:var(--cyan)}
.err{color:var(--pink);font-family:var(--pixel);font-size:13px;min-height:1.4em;margin-top:12px}
.back{font-family:var(--pixel);font-size:13px;color:var(--sub);background:none;border:0;cursor:pointer;margin-top:18px;align-self:flex-start;padding:4px 0}
.back:hover{color:var(--cyan)}
/* 화면 전환: 글리치 */
.vhs{animation:glitch .4s steps(4)}
@keyframes glitch{0%{filter:hue-rotate(90deg) contrast(1.6);transform:translateX(-6px) skewX(4deg)}33%{transform:translateX(5px)}66%{filter:hue-rotate(-60deg);transform:translateX(-2px)}100%{filter:none;transform:none}}
/* 결과 카드 */
.vs{text-align:center;font-family:var(--arc);font-size:10px;color:var(--cyan);letter-spacing:.15em;margin-bottom:6px}
.vs b{display:block;font-family:var(--logo);font-size:40px;font-weight:400;color:var(--neon);letter-spacing:0;margin-top:10px;text-shadow:3px 3px 0 var(--pink);animation:pop 1.2s ease-in-out infinite alternate}
@keyframes pop{to{transform:scale(1.06)}}
.sheet{position:relative;background:#0d0626;border:3px solid var(--neon);box-shadow:0 0 0 3px var(--pink),0 0 30px rgba(255,43,214,.6);padding:20px 18px 22px;margin-top:10px}
.sheet .tc{display:flex;justify-content:space-between;font-family:var(--arc);font-size:8px;color:var(--cyan);margin-bottom:16px}
.rank{position:absolute;right:-6px;top:-14px;font-family:var(--arc);font-size:20px;color:var(--pink);background:var(--neon);padding:10px 12px;transform:rotate(12deg);box-shadow:4px 4px 0 var(--cyan);z-index:2}
.who{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.portrait{flex:none;width:96px;height:120px;background:radial-gradient(circle at 50% 40%,var(--pink),#3a0c5c 65%,#0d0626);border:2px solid var(--cyan);overflow:hidden;display:flex;align-items:center;justify-content:center}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait svg{width:70%;height:70%}
.who .name{font-family:var(--logo);font-size:28px;line-height:1.25;color:#fff;text-shadow:2px 2px 0 var(--pink)}
.who .work{color:var(--cyan);font-size:14px;margin-top:4px}
.depth{font-family:var(--pixel);font-size:12px;color:var(--sub);margin-top:8px}
.depth b{color:var(--text);font-weight:400}
.sec{margin-top:20px;padding-top:16px;border-top:2px dashed var(--line)}
.sec h3{font-family:var(--arc);font-size:9px;font-weight:400;color:var(--pink);margin-bottom:10px;line-height:1.8;letter-spacing:.04em}
.sec h3 .muted{font-family:var(--pixel);font-size:11px}
.sec ol{padding-left:20px}
.sec li{margin-bottom:8px}
.sec li::marker{color:var(--neon)}
.portrait.big{width:170px;height:212px;margin:6px auto 16px;border:3px solid var(--neon);box-shadow:0 0 0 3px var(--pink),0 0 24px rgba(255,43,214,.6)}
.card-top{text-align:center}
.imgrow{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.portrait.sm{width:56px;height:70px}
.imgrow input{font-size:13px;padding:6px 8px}
.card-top .name,.reveal .name{font-family:var(--logo);font-size:34px;line-height:1.2;color:#fff;text-shadow:3px 3px 0 var(--pink),0 0 18px rgba(255,43,214,.6)}
.card-top .work{color:var(--cyan);font-size:14px;margin-top:4px}
.reveal{text-align:center}
.verdict{display:inline-block;font-size:16px;color:var(--bg);background:var(--neon);padding:3px 12px;margin:14px 0 6px}
.kw{font-family:var(--pixel);font-size:13px;color:var(--pink)}
.mbti{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mbti .opt{text-align:center;padding:11px 4px;font-family:var(--arc);font-size:10px}
.mbti .opt::before{display:none}
.comp{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin-bottom:12px;font-size:14px}
.comp b{font-family:var(--arc);font-size:10px;font-weight:400;color:var(--neon)}
.bar{grid-column:1/3;height:12px;background:#2a1450;border:2px solid #fff;padding:1px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--cyan) 0 6px,#0bb5bd 6px 8px)}
.bar i.on{background:repeating-linear-gradient(90deg,var(--neon) 0 6px,#ffb000 6px 8px)}
.sync{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-family:var(--arc);font-size:8px;color:#fff;margin-top:6px}
.sync .bar{grid-column:auto}
details.more summary{cursor:pointer;font-family:var(--pixel);font-size:14px;color:var(--neon);list-style:none}
details.more summary::before{content:'▶ '} details.more[open] summary::before{content:'▼ '}
details.more h3{margin-top:18px}
.quote{font-size:17px;line-height:1.75;color:#fff;background:#140a33;border-left:4px solid var(--neon);padding:10px 14px;margin:6px 0 18px}
.spoil{filter:blur(6px);cursor:pointer;transition:filter .2s}
.spoil.open{filter:none}
.note{font-family:var(--pixel);font-size:12px;color:var(--sub);margin-top:16px}
.ver{font-family:var(--arc);font-size:8px;color:var(--line);margin-top:28px;text-align:center}
.watermark{font-family:var(--pixel);font-size:10px;color:var(--sub);text-align:right;margin-top:14px}
.cont{text-align:center;margin-top:20px;font-family:var(--arc);font-size:9px;color:var(--neon);animation:blink 1s steps(2) infinite}
/* 관리자 / 발표 */
.wide main{max-width:1080px;justify-content:flex-start}
table{width:100%;border-collapse:collapse;font-size:14px;font-family:var(--pixel)}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--cyan);font-weight:400}
td select{font-size:13px;padding:4px 6px}
.slide{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.slide .big{font-family:var(--logo);font-size:60px;line-height:1.15;font-weight:400;text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--cyan)}
.slide .big.neon{color:var(--neon)}
.slide .hint{font-size:24px;margin:10px 0}
.slide .who .portrait{border:3px solid var(--neon);box-shadow:0 0 0 3px var(--pink),0 0 30px var(--pink)}
.counter{font-family:var(--arc);color:var(--pink);font-size:11px}
.bonds{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.bond{background:#0d0626;border:2px solid var(--cyan);box-shadow:4px 4px 0 var(--pink);padding:14px}

/* ── 레어도 · 뽑기 공개 ── */
:root{--ssr:#ffe14d;--sr:#ff2bd6;--r:#19f7ff;--n:#cfc8ea}
.flipwrap{position:relative;width:230px;height:330px;margin:10px auto 6px;perspective:1100px;cursor:pointer}
.flipwrap .fi{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.4,.5,1)}
.flipwrap.open .fi{transform:rotateY(180deg)}
.flipwrap.charge .fi{animation:charge 1.6s ease-in forwards}
@keyframes charge{0%{transform:rotateY(0)}15%{transform:rotateY(-12deg) translateX(-3px)}30%{transform:rotateY(12deg) translateX(3px)}45%{transform:rotateY(-18deg) translateX(-5px)}60%{transform:rotateY(18deg) translateX(5px)}80%{transform:rotateY(-6deg) scale(1.04)}100%{transform:rotateY(0) scale(1.06)}}
.flipwrap .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--gc,#fff);background:#0d0626;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3px #05030d,0 0 26px var(--gc,#fff)}
.flipwrap .back{background:repeating-linear-gradient(45deg,#2a1450 0 12px,#140a33 12px 24px)}
.flipwrap .back b{font-family:var(--arc);font-size:56px;color:var(--neon);text-shadow:4px 4px 0 var(--pink);animation:pop .5s ease-in-out infinite alternate}
.flipwrap .back i{font-style:normal;font-family:var(--arc);font-size:9px;color:var(--cyan);margin-top:18px;letter-spacing:.15em}
.flipwrap .front{transform:rotateY(180deg);padding:12px;justify-content:flex-start}
.flipwrap .front .portrait{width:100%;height:220px;border:0;box-shadow:none;margin:0}
.flipwrap .front .nm{font-family:var(--logo);font-size:24px;line-height:1.2;color:#fff;text-shadow:2px 2px 0 var(--pink);margin-top:10px;text-align:center}
.flipwrap .front .wk{font-size:12px;color:var(--cyan)}
.gbadge{position:absolute;top:-14px;right:-16px;z-index:3;font-family:var(--arc);font-size:15px;color:#05030d;background:var(--gc,#fff);padding:8px 9px;transform:rotate(10deg);box-shadow:3px 3px 0 #05030d}
.charge-glow{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,var(--gc,#fff) 0,transparent 65%);opacity:0;pointer-events:none}
.flipwrap.charge .charge-glow{animation:glowup 1.6s ease-in forwards}
@keyframes glowup{to{opacity:.55;transform:scale(1.15)}}
.g-SSR{--gc:var(--ssr)} .g-SR{--gc:var(--sr)} .g-R{--gc:var(--r)} .g-N{--gc:var(--n)} .g-HIDDEN{--gc:#7cff4f}
.g-SSR.open .front,.g-HIDDEN.open .front{animation:rainbow 1.2s linear infinite}
@keyframes rainbow{0%{border-color:#ffe14d}25%{border-color:#ff2bd6}50%{border-color:#19f7ff}75%{border-color:#7cff4f}100%{border-color:#ffe14d}}
.g-SSR.open::after{content:"";position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;z-index:-1;background:repeating-conic-gradient(rgba(255,225,77,.28) 0 8deg,transparent 8deg 16deg);animation:spin 10s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 65%);mask:radial-gradient(circle,#000 25%,transparent 65%)}
.rate{font-family:var(--pixel);font-size:13px;color:var(--sub);margin-top:6px}
.rate b{color:var(--gc,#fff);font-weight:400}
.after{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none}
.after.on{opacity:1;transform:none;pointer-events:auto}
.gtitle{font-family:var(--arc);font-size:12px;color:var(--gc,#fff);text-shadow:0 0 10px var(--gc,#fff);letter-spacing:.1em;margin-top:8px;min-height:1.6em}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx .flash{position:absolute;inset:0;background:#fff;animation:flash .6s ease-out forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
#fx i{position:absolute;top:-20px;width:9px;height:9px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.rank.g-SSR,.rank.g-SR,.rank.g-R,.rank.g-N,.rank.g-HIDDEN{background:var(--gc);color:#05030d}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:70;font-family:var(--arc);font-size:12px;color:#05030d;background:#7cff4f;padding:14px 18px;box-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--cyan);animation:pop .4s ease-in-out 4 alternate}
.secret-btn{display:block;margin:18px auto 0;font:14px var(--pixel);color:#7cff4f;background:#05030d;border:2px dashed #7cff4f;padding:10px 16px;cursor:pointer;animation:blink 1.2s steps(2) infinite}
/* ═══ v2.0 화려함 추가 ═══ */
/* 배경 무대: 네온 바닥 격자 + 줄무늬 태양 + 떠다니는 픽셀 외계인 */
#stage-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#stage-bg .sun{position:absolute;left:50%;bottom:12vh;width:42vh;height:42vh;margin-left:-21vh;border-radius:50%;
  background:linear-gradient(#ffe14d,#ff7a3d 45%,#ff2bd6 80%);opacity:.2;filter:blur(.3px);
  -webkit-mask:linear-gradient(#000 0 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 76%,transparent 76% 82%,#000 82% 88%,transparent 88%);
  mask:linear-gradient(#000 0 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 69%,#000 69% 76%,transparent 76% 82%,#000 82% 88%,transparent 88%)}
#stage-bg .floor{position:absolute;left:-50%;right:-50%;bottom:-2vh;height:26vh;transform:perspective(26vh) rotateX(58deg);transform-origin:bottom;opacity:.55;
  background-image:linear-gradient(#ff2bd6 2px,transparent 2px),linear-gradient(90deg,#19f7ff 2px,transparent 2px);background-size:48px 48px;animation:floor 1s linear infinite;
  -webkit-mask:linear-gradient(transparent,#000 40%);mask:linear-gradient(transparent,#000 40%)}
@keyframes floor{to{background-position:0 48px,0 0}}
#stage-bg .inv{position:absolute;width:4px;height:4px;color:#7cff4f;opacity:.55;animation:drift linear infinite;
  box-shadow:8px 0,24px 0,12px 4px,20px 4px,8px 8px,12px 8px,16px 8px,20px 8px,24px 8px,4px 12px,8px 12px,16px 12px,24px 12px,28px 12px,0 16px,4px 16px,8px 16px,12px 16px,16px 16px,20px 16px,24px 16px,28px 16px,32px 16px,0 20px,8px 20px,24px 20px,32px 20px,12px 24px,20px 24px}
#stage-bg .inv.a{left:6%;top:18%;animation-duration:19s}
#stage-bg .inv.b{left:80%;top:32%;color:#ff2bd6;animation-duration:24s;animation-delay:-8s}
#stage-bg .inv.c{left:45%;top:8%;color:#19f7ff;animation-duration:28s;animation-delay:-14s}
@keyframes drift{0%{transform:translate(0,0)}25%{transform:translate(40px,30px)}50%{transform:translate(-20px,60px)}75%{transform:translate(-50px,20px)}100%{transform:translate(0,0)}}
/* 화면 테두리 전구 (둘레를 따라 흐름) */
.bulbs{position:fixed;z-index:40;pointer-events:none;background-repeat:repeat;animation:chase .45s steps(2) infinite}
.bulbs.t,.bulbs.b{left:0;right:0;height:10px;background-image:radial-gradient(circle,#ffe14d 0 2.5px,transparent 3.5px),radial-gradient(circle,#ff2bd6 0 2.5px,transparent 3.5px);background-size:28px 10px;background-position:0 0,14px 0}
.bulbs.t{top:0}.bulbs.b{bottom:0}
.bulbs.l,.bulbs.r{top:0;bottom:0;width:10px;background-image:radial-gradient(circle,#19f7ff 0 2.5px,transparent 3.5px),radial-gradient(circle,#ffe14d 0 2.5px,transparent 3.5px);background-size:10px 28px;background-position:0 0,0 14px}
.bulbs.l{left:0}.bulbs.r{right:0}
@keyframes chase{50%{background-position:14px 0,0 0}}
.bulbs.l,.bulbs.r{animation-name:chasev}
@keyframes chasev{50%{background-position:0 14px,0 0}}
/* HUD: 이퀄라이저 + 지금 재생 */
.hud .mus{display:flex;align-items:center;gap:8px}
#eq{display:inline-flex;align-items:flex-end;gap:2px;height:18px}
#eq i{display:block;width:4px;height:3px;background:linear-gradient(#ff2bd6,#ffe14d)}
#np{font-family:var(--pixel);font-size:11px;color:var(--neon);white-space:nowrap}
.hud>span:first-child{white-space:nowrap}
@media (max-width:420px){.hud{font-size:8px;padding:16px 16px 0}#np{font-size:10px}.hud .tlabel{display:none}}
/* 박자 쿵 */
.beat .marquee .logo{transform:skew(-6deg) scale(1.05)}
.beat .marquee{box-shadow:0 0 0 3px var(--cyan),0 0 40px var(--cyan),inset 0 0 40px rgba(25,247,255,.4)}
.beat .pend{filter:drop-shadow(0 0 22px #ffe14d)}
.beat .sub{box-shadow:inset 0 0 0 3px #0a0620,inset 0 0 0 5px var(--cyan),0 0 28px rgba(25,247,255,.55)}
.beat #stage-bg .sun{opacity:.3}
.marquee .logo,.marquee,.pend,.sub{transition:transform .1s,box-shadow .1s,filter .1s}
/* 로고 글리치 */
.marquee .logo{animation:logoglitch 4s steps(1) infinite}
@keyframes logoglitch{0%,88%,100%{text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--cyan),0 0 24px rgba(255,225,77,.6)}
  90%{text-shadow:-6px 0 0 var(--pink),6px 2px 0 var(--cyan),0 0 24px rgba(255,225,77,.6);clip-path:inset(10% 0 40% 0)}
  92%{text-shadow:8px -2px 0 var(--pink),-4px 3px 0 var(--cyan);clip-path:inset(50% 0 5% 0)}
  94%{text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--cyan);clip-path:none}}
/* 대화창 테두리 색 순환 */
.sub{animation:boxcycle 3s linear infinite}
@keyframes boxcycle{0%,100%{border-color:#fff}33%{border-color:var(--neon)}66%{border-color:var(--cyan)}}
/* STAGE 스플래시 */
.splash{position:fixed;left:0;right:0;top:38%;z-index:55;pointer-events:none;text-align:center;animation:splash 1.15s ease-out forwards}
.splash b{display:inline-block;font-family:var(--arc);font-size:34px;color:var(--neon);text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--cyan);padding:14px 26px;background:linear-gradient(90deg,transparent,rgba(5,3,13,.92) 20%,rgba(5,3,13,.92) 80%,transparent)}
.splash small{display:block;font-family:var(--arc);font-size:11px;color:#fff;margin-top:10px;letter-spacing:.3em}
@keyframes splash{0%{transform:translateX(100vw) skewX(-20deg)}22%{transform:translateX(-12px) skewX(6deg)}30%{transform:none}78%{transform:none;opacity:1}100%{transform:translateX(-100vw) skewX(-20deg);opacity:0}}
/* 선택지: 빛줄기 + 불꽃 */
.opt{overflow:hidden}
.opt::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);transition:left .45s}
.opt:hover::after{left:120%}
.spark{position:fixed;z-index:58;width:6px;height:6px;pointer-events:none;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.bonus{position:fixed;z-index:58;pointer-events:none;font-family:var(--arc);font-size:11px;color:#7cff4f;text-shadow:2px 2px 0 #05030d;animation:bonus 1s ease-out forwards}
@keyframes bonus{to{transform:translateY(-50px);opacity:0}}
/* 결과 카드: 무지개 테두리 + 초상 홀로그램 */
.sheet{animation:sheetcycle 2.4s linear infinite}
@keyframes sheetcycle{0%,100%{border-color:var(--neon);box-shadow:0 0 0 3px var(--pink),0 0 30px rgba(255,43,214,.6)}50%{border-color:var(--cyan);box-shadow:0 0 0 3px var(--neon),0 0 36px rgba(25,247,255,.6)}}
.portrait{position:relative}
.portrait.big::after,.flipwrap .front .portrait::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%);animation:holo 2.8s ease-in-out infinite;pointer-events:none}
@keyframes holo{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.shake{animation:shake .45s steps(6)}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){h1{font-size:28px}.marquee .logo{font-size:50px}.who .name{font-size:24px}.slide .big{font-size:40px}.card-top .name,.reveal .name{font-size:28px}}
</style>
</head>
<body>
<div id="stage-bg" aria-hidden="true"><div class="sun"></div><div class="floor"></div><i class="inv a"></i><i class="inv b"></i><i class="inv c"></i></div>
<div class="bulbs t"></div><div class="bulbs b"></div><div class="bulbs l"></div><div class="bulbs r"></div>
<div id="app">
  <div class="hud"><span><span class="rec">CREDIT 01</span><span class="tlabel"> · TIME</span> <span id="tc">00:00:00</span></span><span class="mus"><span id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span id="np"></span><button id="snd" aria-pressed="true" title="소리 끄기">♪ ON</button></span></div>
  <main id="view" aria-live="polite"></main>
</div>
<script>
const API='/api/game';
const $=s=>document.querySelector(s);
const view=$('#view');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 타임코드
const t0=Date.now(); setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#tc').textContent=[s/3600|0,(s/60|0)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');},1000);

// 소리: 기본 켜짐. 브라우저 정책상 첫 클릭·키 입력 순간에 시작된다.
/* ── 칩튠 음악 엔진: 화면마다 다른 BGM (타이틀 · 최면 · 스테이지 · 결과) ── */
let actx=null, master=null, soundOn=true, musicBus=null, echoIn=null, analyser=null, NOISE=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(actx) return; actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=soundOn?1:0;
  const comp=actx.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=8; comp.ratio.value=4;
  analyser=actx.createAnalyser(); analyser.fftSize=64; analyser.smoothingTimeConstant=.7;
  master.connect(comp); comp.connect(analyser); analyser.connect(actx.destination);
  musicBus=actx.createGain(); musicBus.gain.value=.62; musicBus.connect(master);
  const dl=actx.createDelay(1); dl.delayTime.value=.28; const fb=actx.createGain(); fb.gain.value=.3; const wet=actx.createGain(); wet.gain.value=.25;
  echoIn=actx.createGain(); echoIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(musicBus);
  NOISE=actx.createBuffer(1,actx.sampleRate,actx.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  setInterval(schedule,25); eqLoop();
}
// ── 악기 ──
function env(g,t,a,peak,dec,sus,end){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.setTargetAtTime(peak*sus,t+a,dec); g.gain.setTargetAtTime(0.0001,end,.03); }
function voice(type,f,t,dur,peak,{echo=0,lp=0,detune=0}={}){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f; if(detune) o.detune.value=detune;
  let node=o; if(lp){ const fl=actx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp; o.connect(fl); node=fl; }
  node.connect(g); g.connect(musicBus); if(echo){ const s=actx.createGain(); s.gain.value=echo; g.connect(s); s.connect(echoIn); }
  env(g,t,.006,peak,.08,.55,t+dur); o.start(t); o.stop(t+dur+.2);
}
function lead(m,t,dur){ voice('square',mtof(m),t,dur,.075,{echo:.5,lp:3600}); voice('square',mtof(m),t,dur,.045,{lp:3000,detune:9}); }
function arp(m,t,dur){ voice('square',mtof(m),t,dur*.6,.03,{echo:.35,lp:2400}); }
function bass(m,t,dur){ voice('triangle',mtof(m),t,dur*.9,.32); voice('square',mtof(m),t,dur*.5,.03,{lp:700}); }
function pad(ms,t,dur){ ms.forEach(m=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(.045,t+dur*.4); g.gain.linearRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(musicBus);
  const s=actx.createGain(); s.gain.value=.4; g.connect(s); s.connect(echoIn); o.start(t); o.stop(t+dur+.05); }); }
function noise(t,dur,peak,hp){ const s=actx.createBufferSource(); s.buffer=NOISE; const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=actx.createGain();
  g.gain.setValueAtTime(peak,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); s.connect(f); f.connect(g); g.connect(musicBus); s.start(t); s.stop(t+dur+.02); }
function kick(t,v=1){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(42,t+.13);
  g.gain.setValueAtTime(.85*v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+.18); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+.2); pulseAt(t); }
function snare(t){ noise(t,.14,.32,1400); voice('triangle',190,t,.06,.12); }
function hat(t){ noise(t,.035,.1,7000); }
// ── 곡 ── chords: [근음, 'M'|'m'] / lead: 8분음표 8칸(숫자=음, '-'=늘임, 0=쉼) / drums: 16칸 (x=킥+하이햇 k=킥 s=스네어 o=스네어+하이햇 h=하이햇)
const TRACKS={
  title:{label:'TITLE THEME',bpm:144,arp:true,bassPat:[0,12,0,12,0,12,7,12],drums:'x-h-o-h-x-x-o-hh',
    chords:[[60,'M'],[55,'M'],[57,'m'],[53,'M'],[60,'M'],[55,'M'],[57,'m'],[53,'M']],
    lead:[[72,0,76,79,84,'-',79,76],[74,0,79,83,86,'-',83,79],[76,0,81,84,88,'-',84,81],[77,79,81,'-',79,77,76,74],
          [76,'-',74,72,74,76,79,'-'],[79,'-',77,74,71,74,79,'-'],[81,'-',79,76,72,76,81,84],[86,'-',84,'-',81,'-',79,0]]},
  stage:{label:'STAGE THEME',bpm:112,arp:true,bassPat:[0,0,12,0,0,12,7,12],drums:'k-h-s-h-k-hkh-s-hh',
    chords:[[57,'m'],[53,'M'],[55,'M'],[52,'M'],[57,'m'],[53,'M'],[55,'M'],[52,'M']],
    lead:[[76,'-','-',72,74,'-',76,0],[77,'-',76,'-',72,'-','-',0],[74,'-','-',71,72,'-',74,0],[71,'-',68,'-',64,'-','-',0],
          [81,'-',79,76,77,'-',76,0],[72,'-',74,76,77,'-',81,0],[79,'-',77,74,74,'-',71,0],[68,71,76,'-',75,'-','-',0]]},
  deep:{label:'HYPNOSIS',bpm:76,arp:true,pad:true,bassPat:[0,'-','-','-',7,'-','-','-'],drums:'k--k------------',soft:true,
    chords:[[57,'m'],[53,'M'],[48,'M'],[52,'M']],lead:null},
  result:{label:'VICTORY',bpm:150,arp:true,bassPat:[0,12,0,12,0,12,0,12],drums:'x-h-o-hxx-h-o-ho',
    chords:[[60,'M'],[53,'M'],[55,'M'],[60,'M']],
    lead:[[72,76,79,84,'-',79,84,'-'],[77,81,84,89,'-',84,81,77],[79,83,86,91,'-',86,83,79],[84,'-',79,'-',76,'-',72,0]]},
};
let mCur=null, mPend=null, mStep=0, mNext=0;
function setTrack(name){ if(name===undefined) return; const t=name?TRACKS[name]:null; if(mCur===t&&!mPend) return;
  if(!mCur){ mCur=t; mStep=0; mNext=actx?actx.currentTime+.05:0; } else mPend=name?t:'stop';
  const np=$('#np'); if(np) np.textContent=t?'♪ '+t.label:''; }
function schedule(){
  if(!actx||!mCur) return;
  if(mNext<actx.currentTime-.2) mNext=actx.currentTime+.05;
  while(mNext<actx.currentTime+.12){
    const T=mCur, sp=60/T.bpm/4, s16=mStep%16, bar=Math.floor(mStep/16)%T.chords.length;
    if(s16===0 && mPend){ mCur=mPend==='stop'?null:mPend; mPend=null; mStep=0; if(!mCur) return; continue; }
    const [root,q]=T.chords[bar], tones=[0,q==='m'?3:4,7,12].map(x=>root+x), t=mNext;
    if(soundOn){
      const dch=T.drums[s16]; if(dch==='x'||dch==='k') kick(t,T.soft?.45:1); if(dch==='s'||dch==='o') snare(t); if(dch==='x'||dch==='o'||dch==='h') hat(t);
      if(s16%2===0){ const b=T.bassPat[s16/2]; if(typeof b==='number'){ let n=1; while(T.bassPat[s16/2+n]==='-') n++; bass(root-24+b,t,sp*2*n); } }
      if(T.arp) arp(tones[(T.soft?Math.floor(s16/2):s16)%4]+12,t,sp*(T.soft?2:1));
      if(T.pad && s16===0) pad(tones.slice(0,3),t,sp*16);
      if(T.lead && s16%2===0){ const ln=T.lead[bar%T.lead.length], v=ln[s16/2]; if(typeof v==='number'&&v>0){ let n=1; while(ln[s16/2+n]==='-') n++; lead(v,t,sp*2*n*.92); } }
    }
    mNext+=sp; mStep++;
  }
}
// 박자에 맞춰 화면이 쿵
function pulseAt(t){ if(reduce) return; setTimeout(()=>{ document.body.classList.add('beat'); setTimeout(()=>document.body.classList.remove('beat'),110); },Math.max(0,(t-actx.currentTime)*1000)); }
function eqLoop(){ const bars=[...document.querySelectorAll('#eq i')], buf=new Uint8Array(analyser.frequencyBinCount);
  (function f(){ analyser.getByteFrequencyData(buf); bars.forEach((b,i)=>{ const v=buf[2+i*3]||0; b.style.height=(3+v/255*15)+'px'; }); requestAnimationFrame(f); })(); }
function typeBlip(){ if(!actx||!soundOn) return; const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(); o.type='square'; o.frequency.value=1250+Math.random()*120;
  g.gain.setValueAtTime(.035,t); g.gain.exponentialRampToValueAtTime(.0001,t+.025); o.connect(g); g.connect(master); o.start(t); o.stop(t+.03); }
function tick(){}
function blip(f=880,d=.07,type='square'){ if(!actx||!soundOn) return; const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.5,t+d); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.01); }
function tune(notes,step=.11,type='square'){ if(!actx||!soundOn) return; const t0=actx.currentTime;
  notes.forEach((f,i)=>{ if(!f) return; const t=t0+i*step,o=actx.createOscillator(),g=actx.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.0001,t+step*1.8); o.connect(g); g.connect(master); o.start(t); o.stop(t+step*2); }); }
const FANFARE={SSR:[523,659,784,1047,0,784,1047,1319,1568],SR:[523,659,784,1047,1319],R:[659,880,1175],N:[784,1047],HIDDEN:[262,0,311,0,370,0,523,622,740,1047]};
function fx(grade){
  let box=$('#fx'); if(!box){ box=document.createElement('div'); box.id='fx'; document.body.appendChild(box); }
  box.innerHTML=''; if(reduce) return;
  if(grade==='SSR'||grade==='HIDDEN') box.insertAdjacentHTML('beforeend','<div class="flash"></div>');
  const n={SSR:90,HIDDEN:70,SR:45,R:16,N:0}[grade]||0, cols=['#ffe14d','#ff2bd6','#19f7ff','#7cff4f','#fff'];
  for(let k=0;k<n;k++){ const i=document.createElement('i'); i.style.left=Math.random()*100+'vw'; i.style.background=cols[k%cols.length];
    i.style.setProperty('--dx',(Math.random()*160-80)+'px'); i.style.animationDuration=(1.6+Math.random()*1.6)+'s'; i.style.animationDelay=Math.random()*.5+'s'; box.appendChild(i); }
  setTimeout(()=>{ box.innerHTML=''; },4200);
}
const GTEXT={SSR:'★ SUPER SPECIAL RARE ★',SR:'SPECIAL RARE',R:'RARE',N:'NORMAL',HIDDEN:'??? HIDDEN ???'};
const rateText=rr=>!rr?'':`등장 확률 <b>${rr.rate<0.01?'0.01% 미만':rr.rate+'%'}</b> · ${rr.total}명 중 ${rr.order<=rr.total/2?rr.order+'번째로 드문':(rr.total-rr.order+1)+'번째로 흔한'} 전생`;
// 카드 뒤집기 연출: 뒷면이 흔들리며 빛나다가(1.6초) 뒤집힌다. 카드를 누르면 바로 뒤집힘
function sparks(el,n=14){ if(reduce) return; const r=el.getBoundingClientRect(), cx=r.left+28, cy=r.top+r.height/2, cols=['#ffe14d','#ff2bd6','#19f7ff','#7cff4f'];
  for(let k=0;k<n;k++){ const s=document.createElement('i'); s.className='spark'; const a=Math.random()*Math.PI*2, d=30+Math.random()*60;
    s.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[k%4]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`; document.body.appendChild(s); setTimeout(()=>s.remove(),650); } }
function floatText(el,t){ if(reduce) return; const r=el.getBoundingClientRect(), f=document.createElement('div'); f.className='bonus'; f.textContent=t;
  f.style.left=(r.right-130)+'px'; f.style.top=(r.top-6)+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(),1000); tune([988,1319],.05); }
function flipCard(grade,onOpen){
  const w=$('#fc'); let done=false;
  const open=()=>{ if(done) return; done=true; w.classList.remove('charge'); w.classList.add('open'); fx(grade); setTrack('result'); if(!reduce&&(grade==='SSR'||grade==='HIDDEN')){ const ap=$('#app'); ap.classList.remove('shake'); void ap.offsetWidth; ap.classList.add('shake'); } tune(FANFARE[grade]||FANFARE.N); onOpen&&onOpen(); };
  if(reduce){ open(); return; }
  w.classList.add('charge'); tune([196,0,220,0,247,0,262,277,294,311],.13,'triangle');
  const t=setTimeout(open,1650); w.onclick=()=>{ clearTimeout(t); open(); };
}

async function api(data,method='POST'){
  const opt=method==='GET'?{}:{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)};
  const url=method==='GET'?API+'?'+new URLSearchParams(data):API;
  const r=await fetch(url,opt); const j=await r.json().catch(()=>({error:'응답을 읽을 수 없습니다.'}));
  if(!r.ok) throw new Error(j.error||'요청에 실패했습니다.'); return j;
}

function type(el,text,done){
  if(reduce){el.textContent=text;done&&done();return;}
  let i=0,stop=false; el.innerHTML=''; const caret=document.createElement('span'); caret.className='caret'; caret.innerHTML='&nbsp;';
  const node=document.createTextNode(''); el.append(node,caret);
  el.onclick=()=>{stop=true;node.data=text;caret.remove();el.onclick=null;done&&done();};
  (function step(){ if(stop) return; if(i>=text.length){caret.remove();el.onclick=null;done&&done();return;}
    const ch=text[i++]; node.data+=ch; if(ch.trim()&&i%2) typeBlip(); setTimeout(step, ch==='…'?420:(ch==='.'?260:(ch==='\n'?300:34))); })();
}

    show(`<div class="slide"><p class="counter">${i+1} / ${list.length} · ${['누구의 전생일까요?','전생 공개','현생 공개'][stage]}</p>
      ${stage===0?`<div style="margin-top:16px">${hints}</div>`:''}
      ${stage>=1?`<div class="who" style="margin-top:16px"><div class="portrait" style="width:140px;height:176px">${portrait(c)}</div><div>${c.rarity?`<span class="verdict g-${c.rarity.grade}" style="background:var(--gc);font-family:var(--arc);font-size:14px">${c.rarity.grade}</span>`:''}<div class="big neon">${esc(c.name)}</div><div class="work" style="font-size:20px">${esc(c.work)}</div><p class="hint">${esc(r.verdict||'')}</p><p class="hint muted">${(r.composition||[]).map(x=>esc(x.name)+' '+x.pct+'%').join(' · ')}</p></div></div>`:''}
      ${stage>=2?`<p class="big" style="font-size:40px;margin-top:20px">${esc(r.nick)}</p>${r.karma?`<p class="hint muted">${esc(r.karma)}</p>`:''}${r.bonds.length?`<p class="hint">전생 인연: ${r.bonds.map(b=>esc(b.nick)+'('+esc(b.name)+')').join(', ')}</p>`:''}${r.soulmate?`<p class="hint">소울메이트: ${esc(r.soulmate.nick)} · 라이벌: ${esc(r.rival?.nick||'-')}</p>`:''}`:''}
      <div class="row"><button class="btn ghost" id="pv">이전</button><button class="btn" id="nx">다음</button><button class="btn ghost" id="bv">인연 지도</button></div></div>`,true);
    $('#nx').onclick=next; $('#pv').onclick=prev; $('#bv').onclick=bondsView;
  }
  function next(){ if(stage<2) stage++; else {i++;stage=0;} render(); }
  function prev(){ if(stage>0) stage--; else if(i>0){i--;stage=2;} render(); }
  function bondsView(){
    const by={}; d.results.forEach(r=>(by[r.char.work]=by[r.char.work]||[]).push(r));
    const groups=Object.entries(by).filter(([,v])=>v.length>1).sort((a,b)=>b[1].length-a[1].length);
    show(`<h1 style="font-size:28px">전생 인연 지도 <small>같은 작품에서 만났던 영혼들</small></h1>
      <div class="bonds" style="margin-top:20px">${groups.map(([w,v])=>`<div class="bond"><p class="neon pixel" style="font-size:13px">${esc(w)}</p>${v.map(r=>`<p style="margin:4px 0">${esc(r.nick)} — ${esc(r.char.name)}</p>`).join('')}</div>`).join('')||'<p class="muted">아직 인연이 없습니다.</p>'}</div>
      <div class="row"><button class="btn ghost" id="bk2">발표로 돌아가기</button></div>`,true);
    $('#bk2').onclick=()=>{ if(i>=list.length) i=list.length-1; render(); };
  }
  document.onkeydown=e=>{ if(!$('#nx')) return; if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();} if(e.key==='ArrowLeft') prev(); };
  render();
}

/* ───────── 시작 ───────── */
const qs=new URLSearchParams(location.search);
const boot=()=>{ if(qs.has('admin')) admin(sessionStorage.getItem('js_admin')); else if(qs.has('present')) present(); else gate(); };
fetch(API+'?action=config').then(r=>r.json()).then(c=>{ if(c.jobs) JOBS=c.jobs; SERVER_VERSION=c.version||'v1.2 이하'; if(c.error) throw new Error(c.error); boot(); }).catch(e=>{ boot(); if(e.message&&$('#err')) $('#err').textContent=e.message; });
</script>
</body>
